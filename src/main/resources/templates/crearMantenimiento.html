<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Crear Mantenimiento',
        currentPage='servicios',
        searchPlaceholder=null,
        topbar_action=~{},
        content=~{:: .content-section},
        extra_css=~{:: link},
        extra_scripts=~{:: script.extra-scripts}
      )}">
<head>
    <link rel="stylesheet" th:href="@{/css/crearMantenimiento.css}" />
</head>
<body>

    <section class="panel mt-4 content-section">
        <div class="panel-header">
            <h2 class="panel-title">
                <i class="fa-solid fa-tools"></i>
                Registrar Nuevo Mantenimiento
            </h2>
            <p class="panel-subtitle">Complete la información del service o reparación efectuada al vehículo.</p>
        </div>

        <form th:action="@{/mantenimientoVehicular/crear}" th:object="${mantenimiento}" method="post" enctype="multipart/form-data" class="mt-4">
            <div class="row g-4">
                <!-- ADMIN / OPERARIO -->
                <div class="col-md-6" th:if="${!esConductor}">
                    <div class="form-group">
                        <label class="form-label">Vehículo</label>

                        <div class="input-container">
                            <input type="text"
                                   th:field="*{nombreVehiculo}"
                                   class="form-control-custom"
                                   list="vehiculosList"
                                   id="vehiculoNombre"
                                   placeholder="Seleccione o ingrese un vehículo"
                                   required>

                            <input type="hidden"
                                   th:field="*{vehiculoId}"
                                   id="vehiculoId">

                            <datalist id="vehiculosList">
                                <option th:each="v : ${vehiculos}"
                                        th:data-id="${v.id}"
                                        th:value="${v.patente + ' - ' + v.modelo.nombreCompletoModelo}">
                                </option>
                            </datalist>
                        </div>
                    </div>
                </div>

                <!-- CONDUCTOR -->
                <div class="col-md-6" th:if="${esConductor}">
                    <div class="form-group">
                        <label class="form-label">Vehículo Asignado</label>

                        <div class="input-container">
                            <input type="text"
                                   class="form-control-custom"
                                   th:value="*{nombreVehiculo}"
                                   readonly>

                            <input type="hidden"
                                   th:field="*{vehiculoId}">
                        </div>
                    </div>
                </div>

                <!-- Kilometraje Actual -->
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Kilometraje Actual</label>
                        <input type="number" th:field="*{kilometrajeActual}" class="form-control-custom" th:classappend="${#fields.hasErrors('kilometrajeActual')} ? 'is-invalid' : ''" placeholder="Ej: 45000" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('kilometrajeActual')}" th:errors="*{kilometrajeActual}"></div>
                    </div>
                </div>

                <!-- Descripción -->
                <div class="col-12">
                    <div class="form-group">
                        <label class="form-label">Descripción del Mantenimiento</label>
                        <textarea th:field="*{descripcion}" class="form-control-custom" th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''" rows="3" placeholder="Detalle los trabajos realizados..."></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                    </div>
                </div>

                <!-- Fechas -->
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label">Fecha de Service</label>
                        <input type="datetime-local" th:field="*{fechaAsignacion}" class="form-control-custom" th:classappend="${#fields.hasErrors('fechaAsignacion')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaAsignacion')}" th:errors="*{fechaAsignacion}"></div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label">Fecha Devolución Estimada</label>
                        <input type="datetime-local" th:field="*{fechaDevolucionEstimada}" class="form-control-custom" th:classappend="${#fields.hasErrors('fechaDevolucionEstimada')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaDevolucionEstimada')}" th:errors="*{fechaDevolucionEstimada}"></div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label">Fecha Devolución Real</label>
                        <input type="datetime-local" th:field="*{fechaDevolucion}" class="form-control-custom" th:classappend="${#fields.hasErrors('fechaDevolucion')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaDevolucion')}" th:errors="*{fechaDevolucion}"></div>
                    </div>
                </div>

                <!-- Comprobante (Archivo) -->
                <div class="col-12">
                    <div class="form-group">
                        <label class="form-label">Adjuntar Comprobante</label>
                        <input type="file" th:field="*{comprobanteArchivo}" class="form-control-custom" accept=".pdf,.jpg,.jpeg,.png" required>
                    </div>
                </div>
            </div>

            <div class="form-actions mt-5 d-flex justify-content-end gap-3">
                <a th:href="@{/mantenimientoVehicular/listado}" class="btn btn-secondary-custom">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary-custom">
                    <i class="fa-solid fa-save"></i>
                    Guardar Mantenimiento
                </button>
            </div>
        </form>
    </section>

    <script class="extra-scripts" th:inline="javascript">
        const vehiculoNombreInput = document.getElementById('vehiculoNombre');
        const vehiculoIdInput = document.getElementById('vehiculoId');
        const vehiculosList = document.getElementById('vehiculosList');

        if (vehiculoNombreInput && vehiculoIdInput && vehiculosList) {

            vehiculoNombreInput.addEventListener('input', function(e) {
                const val = e.target.value;
                const options = vehiculosList.options;

                vehiculoIdInput.value = "";

                for (let i = 0; i < options.length; i++) {
                    if (options[i].value === val) {
                        vehiculoIdInput.value = options[i].getAttribute('data-id');
                        break;
                    }
                }
            });

            window.addEventListener('load', function() {
                const currentVehiculoId = vehiculoIdInput.value;

                if (currentVehiculoId) {
                    const options = vehiculosList.options;

                    for (let i = 0; i < options.length; i++) {
                        if (options[i].getAttribute('data-id') === currentVehiculoId) {
                            vehiculoNombreInput.value = options[i].value;
                            break;
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
