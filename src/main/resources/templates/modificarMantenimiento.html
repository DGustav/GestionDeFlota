<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Modificar Mantenimiento',
        currentPage='servicios',
        searchPlaceholder=null,
        topbar_action=~{},
        content=~{:: .content-section},
        extra_css=~{:: link},
        extra_scripts=~{:: script.extra-scripts}
      )}">
<head>
    <!-- Reutilizamos el CSS de crear ya que los estilos son idénticos para el formulario -->
    <link rel="stylesheet" th:href="@{/css/crearMantenimiento.css}" />
</head>
<body>

    <section class="panel mt-4 content-section">
        <div class="panel-header">
            <h2 class="panel-title">
                <i class="fa-solid fa-pen-to-square"></i>
                Modificar Service o mantenimiento <span th:text="'#' + ${mantenimiento.id}"></span>
            </h2>
            <p class="panel-subtitle">Actualice la información del registro de mantenimiento seleccionado.</p>
        </div>

        <form th:action="@{/mantenimientoVehicular/modificar}" th:object="${mantenimiento}" method="post" enctype="multipart/form-data" class="mt-4">
            <input type="hidden" th:field="*{id}">
            
            <div class="row g-4">
                <!-- Vehículo -->
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Vehículo</label>
                        <div class="input-container">
                            <input type="text" th:field="*{nombreVehiculo}" class="form-control-custom" list="vehiculosList" id="vehiculoNombre" placeholder="Seleccione o ingrese un vehículo" required>
                            <input type="hidden" th:field="*{vehiculoId}" id="vehiculoId">
                            <datalist id="vehiculosList">
                                <option th:each="v : ${vehiculos}" th:data-id="${v.id}" th:value="${v.patente + ' - ' + v.modelo.nombreCompletoModelo}"></option>
                            </datalist>
                        </div>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('vehiculoId')}" th:errors="*{vehiculoId}"></div>
                    </div>
                </div>

                <!-- Kilometraje Actual -->
                <div class="col-md-3">
                    <div class="form-group">
                        <label class="form-label">Kilometraje Actual</label>
                        <input type="number" th:field="*{kilometrajeActual}" class="form-control-custom" th:classappend="${#fields.hasErrors('kilometrajeActual')} ? 'is-invalid' : ''" placeholder="Ej: 45000" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('kilometrajeActual')}" th:errors="*{kilometrajeActual}"></div>
                    </div>
                </div>

                <!-- Tipo de Mantenimiento -->
                <div class="col-md-3">
                    <div class="form-group">
                        <label class="form-label">Tipo</label>
                        <select th:field="*{tipo}" class="form-control-custom" th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid' : ''" required>
                            <option value="" disabled>Seleccione un tipo</option>
                            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}" th:selected="${t == mantenimiento.tipo}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
                    </div>
                </div>

                <!-- Descripción -->
                <div class="col-12">
                    <div class="form-group">
                        <label class="form-label">Descripción del service o mantenimiento</label>
                        <textarea th:field="*{descripcion}" class="form-control-custom" th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''" rows="3" placeholder="Detalle los trabajos realizados..."></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                    </div>
                </div>

                <!-- Fechas -->
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label">Fecha de service o mantenimiento</label>
                        <input type="datetime-local" th:field="*{fechaAsignacion}" class="form-control-custom" th:classappend="${#fields.hasErrors('fechaAsignacion')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaAsignacion')}" th:errors="*{fechaAsignacion}"></div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label">Fecha Devolución Estimada</label>
                        <input type="datetime-local" th:field="*{fechaDevolucionEstimada}" class="form-control-custom" th:classappend="${#fields.hasErrors('fechaDevolucionEstimada')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaDevolucionEstimada')}" th:errors="*{fechaDevolucionEstimada}"></div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label">Fecha Devolución Real</label>
                        <input type="datetime-local" th:field="*{fechaDevolucion}" class="form-control-custom" th:classappend="${#fields.hasErrors('fechaDevolucion')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaDevolucion')}" th:errors="*{fechaDevolucion}"></div>
                    </div>
                </div>

                <!-- Comprobante -->
                <div class="col-12">
                    <div class="form-group">
                        <label class="form-label">Adjuntar Nuevo Comprobante (opcional)</label>
                        <input type="file" th:field="*{comprobanteArchivo}" id="archivo" class="form-control-custom" accept=".pdf,.jpg,.jpeg,.png">
                        <small class="text-muted mt-2 d-block">Deje en blanco si no desea cambiar el comprobante actual.</small>
                    </div>
                </div>
            </div>

            <div class="form-actions mt-5 d-flex justify-content-end gap-3">
                <a th:href="@{/mantenimientoVehicular/listado}" class="btn btn-secondary-custom">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary-custom">
                    <i class="fa-solid fa-save"></i>
                    Actualizar Mantenimiento
                </button>
            </div>
        </form>
    </section>

    <script class="extra-scripts" src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script class="extra-scripts" th:inline="javascript">
        const vehiculoNombreInput = document.getElementById('vehiculoNombre');
        const vehiculoIdInput = document.getElementById('vehiculoId');
        const vehiculosList = document.getElementById('vehiculosList');

        vehiculoNombreInput.addEventListener('input', function(e) {
            const val = e.target.value;
            const options = vehiculosList.options;
            vehiculoIdInput.value = ""; // Reset by default
            
            for (let i = 0; i < options.length; i++) {
                if (options[i].value === val) {
                    vehiculoIdInput.value = options[i].getAttribute('data-id');
                    break;
                }
            }
        });

        // Al cargar la página, si hay un valor en vehiculoId, intentar poner el nombre en el input correspondiente
        window.addEventListener('load', function() {
            const currentVehiculoId = vehiculoIdInput.value;
            if (currentVehiculoId) {
                const options = vehiculosList.options;
                for (let i = 0; i < options.length; i++) {
                    if (options[i].getAttribute('data-id') === currentVehiculoId) {
                        vehiculoNombreInput.value = options[i].value;
                        break;
                    }
                }
            }
        });

        document.getElementById("archivo").addEventListener("change", function () {
            const archivo = this.files[0];
            const maxSize = 10 * 1024 * 1024; // 10 MB


            if (archivo && archivo.size > maxSize) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Archivo demasiado grande',
                    text: 'El archivo seleccionado supera el tamaño máximo permitido de 10 MB.',
                    confirmButtonColor: '#004b81'
                });

                this.value = ""; // Limpia la selección
            }
        });
    </script>
</body>
</html>
