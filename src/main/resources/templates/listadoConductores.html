<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Listado de Conductores - Gestión de Flota',
        currentPage='conductores',
        searchPlaceholder='Buscar conductores por DNI, nombre o apellido, legajo, usuario o e-mail',
        topbar_action=~{:: .topbar-btn},
        content=~{:: .content-section},
        extra_css=~{},
        extra_scripts=~{:: script.extra-script},
        searchAction='/conductor/listado'
      )}" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
</head>
<body>

    <a th:href="@{/conductor/crear}" class="btn btn-primary-custom me-2 text-decoration-none topbar-btn" sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERARIO', 'AUDITOR')">
        <i class="fa-solid fa-plus"></i>
        <span>Nuevo <span class="d-none d-sm-inline">conductor</span></span>
    </a>

    <section class="panel mt-4 content-section">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="table-responsive">
            <table class="fleet-table table align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre y Apellido</th>
                    <th class="d-none d-sm-table-cell">DNI</th>
                    <th class="d-none d-md-table-cell">Legajo</th>
                    <th class="d-none d-lg-table-cell">Usuario</th>
                    <th class="d-none d-lg-table-cell">E-mail</th>
                    <th class="d-none d-lg-table-cell">Categoria Bio</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="conductor : ${conductores}">
                    <td th:text="${conductor.id}">1</td>
                    <td>
                        <div class="desc-title" th:text="${conductor.nomApe}">Gustavo Porcel</div>
                    </td>
                    <td class="d-none d-sm-table-cell" th:text="${conductor.dni}">20123456</td>
                    <td class="d-none d-md-table-cell" th:text="${conductor.legajo}">1001</td>
                    <td class="d-none d-lg-table-cell" th:text="${conductor.usuario.nickname}">gporcel</td>
                    <td class="d-none d-lg-table-cell" th:text="${conductor.mail}">gustavo.porcel@biosidus.com.ar</td>
                    <td class="d-none d-lg-table-cell" th:text="${conductor.rango}">APM</td>
                    <td class="text-center">
                        <a th:href="@{/conductor/detalle/{id}(id=${conductor.id})}" class="text-info me-2" title="Ver detalle">
                            <i class="fa-solid fa-eye"></i>
                        </a>
                        <a th:href="@{/conductor/modificar/{id}(id=${conductor.id})}" class="text-primary" title="Modificar" sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERARIO')">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="panel-footer mt-auto d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
            <p class="m-0">
                Mostrando conductores del <span th:text="${paginaActual * tamanioPagina + 1}"></span>
                al <span th:text="${(paginaActual + 1) * tamanioPagina > totalItems ? totalItems : (paginaActual + 1) * tamanioPagina}"></span>
                de un total de <span th:text="${totalItems}"></span>
            </p>
            <nav aria-label="Page navigation" th:if="${totalPages > 1}">
                <ul class="pagination m-0"
                    th:with="maxPaginas=5,
                 mitad=${maxPaginas / 2},
                 inicio=${paginaActual - mitad < 0 ? 0 : (paginaActual + mitad >= totalPages ? totalPages - maxPaginas : paginaActual - mitad)},
                 final=${paginaActual + mitad >= totalPages ? totalPages - 1 : (paginaActual - mitad < 0 ? (maxPaginas > totalPages ? totalPages - 1 : maxPaginas - 1) : paginaActual + mitad)},
                 inicioReal=${inicio < 0 ? 0 : inicio}">

                    <li class="page-item" th:classappend="${paginaActual == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/conductor/listado(page=0, buscar=${busqueda}, disponible=${disponible}, estado=${estadoSeleccionado}, origen=${origenSeleccionado}, propietario=${propietarioSeleccionado}, tipoVehiculo=${tipoVehiculoSeleccionado})}" title="Primera página">
                            <i class="fa-solid fa-angles-left"></i>
                        </a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/conductor/listado(page=${paginaActual - 1}, buscar=${busqueda}, disponible=${disponible}, estado=${estadoSeleccionado}, origen=${origenSeleccionado}, propietario=${propietarioSeleccionado}, tipoVehiculo=${tipoVehiculoSeleccionado})}">Anterior</a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(inicioReal, final)}"
                        th:classappend="${paginaActual == i ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/conductor/listado(page=${i}, buscar=${busqueda}, disponible=${disponible}, estado=${estadoSeleccionado}, origen=${origenSeleccionado}, propietario=${propietarioSeleccionado}, tipoVehiculo=${tipoVehiculoSeleccionado})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual + 1 == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/conductor/listado(page=${paginaActual + 1}, buscar=${busqueda}, disponible=${disponible}, estado=${estadoSeleccionado}, origen=${origenSeleccionado}, propietario=${propietarioSeleccionado}, tipoVehiculo=${tipoVehiculoSeleccionado})}">Siguiente</a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual + 1 == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/conductor/listado(page=${totalPages - 1}, buscar=${busqueda}, disponible=${disponible}, estado=${estadoSeleccionado}, origen=${origenSeleccionado}, propietario=${propietarioSeleccionado}, tipoVehiculo=${tipoVehiculoSeleccionado})}" title="Última página">
                            <i class="fa-solid fa-angles-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
            <a th:href="@{/conductor/exportar/excel(buscar=${busqueda})}"
               class="btn btn-success me-2 text-decoration-none">
                <i class="fa-solid fa-file-excel"></i>
                <span>Exportar <span class="d-none d-sm-inline">Excel</span></span>
            </a>
        </div>
    </section>
    <script class="extra-script" src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script class="extra-script" th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            const exito = /*[[${exito}]]*/ null;

            if (exito) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Éxito!',
                    text: exito,
                    confirmButtonColor: '#004b81'
                });
            }
        });
        /*]]>*/
    </script>
</body>
</html>
