<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Listado de Conductores - Gestión de Flota',
        currentPage='conductores',
        searchPlaceholder='Buscar conductores',
        topbar_action=~{:: .topbar-btn},
        content=~{:: .content-section},
        extra_css=~{},
        extra_scripts=~{},
        searchAction='/conductor/listado'
      )}">
<head>
</head>
<body>

    <a th:href="@{/conductor/crear}" class="btn btn-primary-custom me-2 text-decoration-none topbar-btn">
        <i class="fa-solid fa-plus"></i>
        <span>Nuevo <span class="d-none d-sm-inline">conductor</span></span>
    </a>

    <section class="panel mt-4 content-section">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="table-responsive">
            <table class="fleet-table table align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre y Apellido</th>
                    <th class="d-none d-sm-table-cell">DNI</th>
                    <th class="d-none d-md-table-cell">Legajo</th>
                    <th class="d-none d-lg-table-cell">Usuario</th>
                    <th class="d-none d-lg-table-cell">E-mail</th>
                    <th class="d-none d-lg-table-cell">Categoria Bio</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="conductor : ${conductores}">
                    <td th:text="${conductor.id}">1</td>
                    <td>
                        <div class="desc-title" th:text="${conductor.nomApe}">Gustavo Porcel</div>
                    </td>
                    <td class="d-none d-sm-table-cell" th:text="${conductor.dni}">20123456</td>
                    <td class="d-none d-md-table-cell" th:text="${conductor.legajo}">1001</td>
                    <td class="d-none d-lg-table-cell" th:text="${conductor.usuario.nickname}">gporcel</td>
                    <td class="d-none d-lg-table-cell" th:text="${conductor.mail}">gustavo.porcel@biosidus.com.ar</td>
                    <td class="d-none d-lg-table-cell" th:text="${conductor.rango}">APM</td>
                    <td class="text-center">
                        <a th:href="@{/conductor/detalle/{id}(id=${conductor.id})}" class="text-info me-2" title="Ver detalle">
                            <i class="fa-solid fa-eye"></i>
                        </a>
                        <a th:href="@{/conductor/modificar/{id}(id=${conductor.id})}" class="text-primary" title="Modificar">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="panel-footer mt-auto d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
            <p class="m-0">
                Mostrando conductores del <span th:text="${paginaActual * tamanioPagina + 1}"></span>
                al <span th:text="${(paginaActual + 1) * tamanioPagina > totalItems ? totalItems : (paginaActual + 1) * tamanioPagina}"></span>
                de un total de <span th:text="${totalItems}"></span>
            </p>
            <nav aria-label="Page navigation" th:if="${totalPages > 1}">
                <ul class="pagination m-0">
                    <li class="page-item" th:classappend="${paginaActual == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/conductor/listado(page=${paginaActual - 1}, buscar=${terminoBusqueda})}">Anterior</a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${paginaActual == i ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/conductor/listado(page=${i}, buscar=${terminoBusqueda})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual + 1 == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/conductor/listado(page=${paginaActual + 1}, buscar=${terminoBusqueda})}">Siguiente</a>
                    </li>
                </ul>
            </nav>
            <button class="btn btn-primary-custom btn-report">
                <i class="fa-solid fa-print"></i>
                Imprimir reporte
            </button>
        </div>
    </section>

</body>
</html>
