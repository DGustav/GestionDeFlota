<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/layout :: layout(~{::title}, 'forbidden', null, ~{}, ~{::content}, ~{}, ~{})}">
<head>
    <title>Acceso Denegado</title>
</head>
<body>

<div th:fragment="content" class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center mt-5">
            <div class="card border-0 shadow-sm p-5">
                <div class="card-body">
                    <div class="mb-4">
                        <i class="fa-solid fa-circle-exclamation text-danger" style="font-size: 80px;"></i>
                    </div>
                    <h1 class="display-4 fw-bold text-dark mb-3">403</h1>
                    <h2 class="h3 mb-4 text-secondary">Acceso No Permitido</h2>
                    <p class="lead text-muted mb-5">
                        Lo sentimos, pero no tienes los permisos necesarios para acceder a esta sección.
                        Si crees que esto es un error, por favor contacta al administrador del sistema.
                    </p>
                    <div class="d-flex justify-content-center gap-3">
                        <a th:href="@{/asignacion/listado}" class="btn btn-primary-custom px-4 py-2">
                            <i class="fa-solid fa-house me-2"></i>Volver al inicio
                        </a>
                        <button onclick="history.back()" class="btn btn-outline-secondary px-4 py-2">
                            <i class="fa-solid fa-arrow-left me-2"></i>Regresar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
