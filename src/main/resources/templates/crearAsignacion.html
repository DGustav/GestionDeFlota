<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Crear Asignación - Gestión de Flota',
        currentPage='asignaciones',
        searchPlaceholder=null,
        topbar_action=~{},
        content=~{:: .content-section},
        extra_css=~{:: link.extra-css},
        extra_scripts=~{:: script.extra-scripts}
      )}">
<head>
    <link class="extra-css" rel="stylesheet" th:href="@{/css/crearVehiculo.css}" />
</head>
<body>

    <section class="panel mt-4 content-section">

        <form th:action="@{/asignacion/guardar}" th:object="${asignacion}" method="POST">
            <div th:if="${#fields.hasAnyErrors() || (error != null)}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:each="err : ${#fields.allErrors()}" th:text="${err} + ' '"></span>
                <span th:if="${error}" th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <section class="panel">
                <h2 class="panel-title">
                    <i class="fa-solid fa-file-signature"></i>
                    Crear Nueva Asignación
                </h2>
                <div class="row">
                    <!-- Vehículo -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Vehículo</label>
                            <div class="input-container">
                                <i class="fa-solid fa-car"></i>
                                <select th:field="*{vehiculoId}" class="form-control-custom" required>
                                    <option value="" disabled selected>Seleccione un vehículo disponible</option>
                                    <option th:each="v : ${vehiculos}" th:value="${v.id}" 
                                            th:text="${v.patente + ' - ' + v.modelo.nombreCompletoModelo}"></option>
                                </select>
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('vehiculoId')}" th:errors="*{vehiculoId}"></div>
                        </div>
                    </div>

                    <!-- Conductor -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Conductor</label>
                            <div class="input-container">
                                <i class="fa-solid fa-user-tie"></i>
                                <select th:field="*{conductorId}" class="form-control-custom" required>
                                    <option value="" disabled selected>Seleccione un conductor</option>
                                    <option th:each="c : ${conductores}" th:value="${c.id}" th:text="${c.nomApe}"></option>
                                </select>
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('conductorId')}" th:errors="*{conductorId}"></div>
                        </div>
                    </div>

                    <!-- Fecha Asignación -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Fecha de Asignación</label>
                            <div class="input-container">
                                <i class="fa-solid fa-calendar-plus"></i>
                                <input type="datetime-local" th:field="*{fechaAsignacion}" class="form-control-custom" required />
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('fechaAsignacion')}" th:errors="*{fechaAsignacion}"></div>
                        </div>
                    </div>

                    <!-- Fecha Devolución Estimada -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Fecha de Devolución Estimada</label>
                            <div class="input-container">
                                <i class="fa-solid fa-calendar-clock"></i>
                                <input type="datetime-local" th:field="*{fechaDevolucionEstimada}" class="form-control-custom" required />
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('fechaDevolucionEstimada')}" th:errors="*{fechaDevolucionEstimada}"></div>
                        </div>
                    </div>

                    <!-- Kilometraje Inicial -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Kilometraje Inicial</label>
                            <div class="input-container">
                                <i class="fa-solid fa-gauge-high"></i>
                                <input type="number" th:field="*{kilometrajeInicial}" class="form-control-custom" placeholder="0" min="0" required />
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('kilometrajeInicial')}" th:errors="*{kilometrajeInicial}"></div>
                        </div>
                    </div>

                    <!-- Estado -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Estado de la Asignación</label>
                            <div class="input-container">
                                <i class="fa-solid fa-circle-info"></i>
                                <select th:field="*{estado}" class="form-control-custom">
                                    <option th:each="est : ${estados}" th:value="${est}" th:text="${est}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-actions mt-4">
                    <a th:href="@{/asignacion/listado}" class="btn btn-secondary-custom text-decoration-none">
                        <i class="fa-solid fa-xmark"></i>
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Guardar Asignación
                    </button>
                </div>
            </section>
        </form>
    </section>

    <script class="extra-scripts" th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            var exito = /*[[${exito}]]*/ null;
            var error = /*[[${error}]]*/ null;

            if (exito) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Éxito!',
                    text: exito,
                    confirmButtonColor: '#004b81'
                });
            }
        });
        /*]]>*/
    </script>
</body>
</html>
