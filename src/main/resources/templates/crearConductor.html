<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Conductor - Gestión de Flota</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
    >
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/crearConductor.css}" />
</head>
<body>
<div class="app container-fluid p-0">
    <!-- Navbar para móviles -->
    <nav class="navbar navbar-expand-lg d-lg-none mobile-navbar">
        <div class="container-fluid">
            <div class="brand-mobile">
                <div class="brand-icon">
                    <i class="fa-solid fa-b"></i>
                </div>
                <span class="brand-text">BIOSIDUS</span>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fa-solid fa-bars text-white"></i>
            </button>
        </div>
    </nav>

    <div class="row g-0 flex-nowrap">
        <!-- Sidebar -->
        <aside class="sidebar col-auto collapse d-lg-flex flex-column" id="sidebarMenu">
            <div class="brand d-none d-lg-flex">
                <div class="brand-icon">
                    <img th:src="@{/images/logo.png}" alt="Logo BIOSIDUS" style="width: 55px; height: auto;">
                </div>
            </div>

            <nav class="menu">
                <a th:href="@{/}" class="menu-item">
                    <i class="fa-solid fa-table-cells-large"></i>
                    <span>Métricas generales</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-car-side"></i>
                    <span>Asignaciones</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-bus"></i>
                    <span>Vehículos</span>
                </a>

                <a th:href="@{/listadoConductores}" class="menu-item active">
                    <i class="fa-solid fa-id-badge"></i>
                    <span>Conductores</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>Services</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Siniestros</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-folder"></i>
                    <span>Documentos</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-bell"></i>
                    <span>Parámetros de Alertas</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content col ps-md-2 pt-2">
            <header class="topbar">
                <!-- Sin buscador ni sección de filtrado en el navbar -->
                <div class="topbar-actions d-flex align-items-center justify-content-end w-100">
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-danger-custom d-none d-sm-flex">Cerrar Sesión</button>
                        <span class="user-label d-none d-md-flex">Gustavo Porcel</span>
                        <div class="avatar">BI</div>
                    </div>
                </div>
            </header>

            <div class="mt-4">
                <form action="#" method="POST">
                    <section class="panel">
                        <h2 class="panel-title">
                            <i class="fa-solid fa-user-plus"></i>
                            Crear Nuevo Conductor
                        </h2>
                        <div class="row">
                            <!-- Datos Personales -->
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Nombre y Apellido</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-user"></i>
                                        <input type="text" class="form-control-custom" placeholder="Ej: Juan Pérez" required name="nomApe">
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="form-group">
                                    <label class="form-label">DNI</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-id-card"></i>
                                        <input type="number" class="form-control-custom" placeholder="Número de documento" required name="dni">
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-3">
                                <div class="form-group">
                                    <label class="form-label">Legajo</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-file-invoice"></i>
                                        <input type="number" class="form-control-custom" placeholder="Número de legajo" required name="legajo">
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Correo Electrónico</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-envelope"></i>
                                        <input type="email" class="form-control-custom" placeholder="ejemplo@biosidus.com" required name="mail">
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Área</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-building"></i>
                                        <select class="form-select-custom" required name="area">
                                            <option value="" disabled selected>Seleccionar área</option>
                                            <option value="VENTAS">VENTAS</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="panel">
                        <!-- Datos de Usuario -->
                        <h2 class="panel-title">
                            <i class="fa-solid fa-key"></i>
                            Datos de Acceso
                        </h2>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Nickname</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-user-tag"></i>
                                        <input type="text" class="form-control-custom" placeholder="Nombre de usuario" required name="nickname">
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Tipo de Usuario (Rango)</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-shield-halved"></i>
                                        <select class="form-select-custom" required name="rango">
                                            <option value="" disabled selected>Seleccionar tipo</option>
                                            <option value="ADMINISTRADOR">ADMINISTRADOR</option>
                                            <option value="OPERATIVO">OPERATIVO</option>
                                            <option value="EMPLEADO">EMPLEADO</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Contraseña</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-lock"></i>
                                        <input type="password" class="form-control-custom" placeholder="********" required name="contrasena">
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Verificar Contraseña</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-lock-open"></i>
                                        <input type="password" class="form-control-custom" placeholder="********" required name="verificacionContrasena">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions mt-4">
                            <button type="button" class="btn btn-secondary-custom">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-primary-custom px-4">
                                <i class="fa-solid fa-save"></i>
                                Guardar Conductor
                            </button>
                        </div>
                    </section>
                </form>
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
