<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Crear Conductor - Gestión de Flota',
        currentPage='conductores',
        searchPlaceholder=null,
        topbar_action=~{},
        content=~{:: .content-section},
        extra_css=~{:: link.extra-css},
        extra_scripts=~{:: script.extra-script}
      )}">
<head>
    <link class="extra-css" rel="stylesheet" th:href="@{/css/crearConductor.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>

    <section class="panel mt-4 content-section">
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <form th:action="@{/registrarConductor}" method="POST" autocomplete="off">
            <section class="panel">
                <h2 class="panel-title">
                    <i class="fa-solid fa-user-plus"></i>
                    Crear Nuevo Conductor
                </h2>
                <div class="row">
                    <!-- Datos Personales -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Nombre y Apellido</label>
                            <div class="input-container">
                                <i class="fa-solid fa-user"></i>
                                <input type="text" class="form-control-custom" placeholder="Ej: Juan Pérez" required name="nomApe" th:value="${conductorDto.nomApe}" autocomplete="off">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label class="form-label">DNI</label>
                            <div class="input-container">
                                <i class="fa-solid fa-id-card"></i>
                                <input type="text" class="form-control-custom" placeholder="Número de documento" required name="dni" maxlength="8" pattern="\d{1,8}" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8);" th:value="${conductorDto.dni}" autocomplete="off">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="form-group">
                            <label class="form-label">Legajo</label>
                            <div class="input-container">
                                <i class="fa-solid fa-file-invoice"></i>
                                <input type="text" class="form-control-custom" placeholder="Número de legajo" required name="legajo" maxlength="4" pattern="\d{1,4}" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);" th:value="${conductorDto.legajo}" autocomplete="off">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Correo Electrónico</label>
                            <div class="input-container">
                                <i class="fa-solid fa-envelope"></i>
                                <input type="email" class="form-control-custom" placeholder="ejemplo@biosidus.com" required name="mail" th:value="${conductorDto.mail}" autocomplete="off">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Rango</label>
                            <div class="input-container">
                                <i class="fa-solid fa-building"></i>
                                <select class="form-select-custom" required name="rango">
                                    <option value="" disabled th:selected="${conductorDto.rango == null}">Seleccionar rango</option>
                                    <option th:each="rangoEnum : ${rangos}"
                                            th:value="${rangoEnum}"
                                            th:text="${rangoEnum}"
                                            th:selected="${conductorDto.rango != null && conductorDto.rango == rangoEnum}">
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel">
                <!-- Datos de Usuario -->
                <h2 class="panel-title">
                    <i class="fa-solid fa-key"></i>
                    Datos de Acceso
                </h2>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Nickname</label>
                            <div class="input-container">
                                <i class="fa-solid fa-user-tag"></i>
                                <input type="text" class="form-control-custom" autocomplete="one-time-code" placeholder="Nombre de usuario" required name="nickname" th:value="${conductorDto.nickname}">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Tipo de Usuario (Rango)</label>
                            <div class="input-container">
                                <i class="fa-solid fa-shield-halved"></i>
                                <select class="form-select-custom" required name="rol">
                                    <option value="" disabled th:selected="${conductorDto.rol == null}">Seleccionar tipo</option>
                                    <option value="ADMINISTRADOR" th:selected="${conductorDto.rol != null && conductorDto.rol.name() == 'ADMINISTRADOR'}">ADMINISTRADOR</option>
                                    <option value="OPERARIO" th:selected="${conductorDto.rol != null && conductorDto.rol.name() == 'OPERARIO'}">OPERARIO</option>
                                    <option value="CONDUCTOR" th:selected="${conductorDto.rol != null && conductorDto.rol.name() == 'CONDUCTOR'}">CONDUCTOR</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Contraseña</label>
                            <div class="input-container">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" class="form-control-custom" placeholder="********" required name="contrasena" autocomplete="new-password">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Verificar Contraseña</label>
                            <div class="input-container">
                                <i class="fa-solid fa-lock-open"></i>
                                <input type="password" class="form-control-custom" placeholder="********" required name="verificacionContrasena" autocomplete="new-password">
                            </div>

                        </div>
                    </div>
                </div>

                <div class="form-actions mt-4">
                    <a th:href="@{/conductor/listado}" class="btn btn-secondary-custom text-decoration-none">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary-custom px-4">
                        <i class="fa-solid fa-save"></i>
                        Guardar Conductor
                    </button>
                </div>
            </section>
        </form>
    </section>
</body>
</html>
