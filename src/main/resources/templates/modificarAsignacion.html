<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Modificar Asignación - Gestión de Flota',
        currentPage='listadoAsignaciones',
        searchPlaceholder=null,
        topbar_action=~{},
        content=~{:: .content-section},
        extra_css=~{:: link.extra-css},
        extra_scripts=~{:: script.extra-scripts}
      )}">
<head>
    <link class="extra-css" rel="stylesheet" th:href="@{/css/crearVehiculo.css}" />
</head>
<body>

    <section class="panel mt-4 content-section">

        <form th:action="@{/asignacion/actualizar}" th:object="${asignacion}" method="POST" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">
            
            <div th:if="${#fields.hasAnyErrors() || (error != null)}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <div th:each="err : ${#fields.allErrors()}" th:text="${err} + '.'"></div>

                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            
            <section class="panel">
                <h2 class="panel-title">
                    <i class="fa-solid fa-pen-to-square"></i>
                    Modificar Asignación #<span th:text="*{id}"></span>
                </h2>
                
                <div class="row">
                    <!-- Vehículo -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Vehículo</label>
                            <div class="input-container">
                                <i class="fa-solid fa-car"></i>
                                <input type="text" th:field="*{nombreVehiculo}" class="form-control-custom form-multi-select" list="vehiculosList" id="vehiculoNombre" placeholder="Seleccione o ingrese un vehículo" required>
                                <input type="hidden" th:field="*{vehiculoId}" id="vehiculoId">
                                <datalist id="vehiculosList">
                                    <option th:each="v : ${vehiculos}" th:data-id="${v.id}" th:value="${v.patente + ' - ' + v.modelo.nombreCompletoModelo}"></option>
                                </datalist>
                            </div>
                        </div>
                    </div>

                    <!-- Conductor -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Conductor</label>
                            <div class="input-container">
                                <i class="fa-solid fa-user-tie"></i>
                                <input type="text" th:field="*{nombreConductor}" class="form-control-custom form-multi-select" list="conductoresList" id="conductorNombre" placeholder="Seleccione o ingrese un conductor" required>
                                <input type="hidden" th:field="*{conductorId}" id="conductorId">
                                <datalist id="conductoresList">
                                    <option th:each="c : ${conductores}" th:data-id="${c.id}" th:value="${c.nomApe}"></option>
                                </datalist>
                            </div>
                        </div>
                    </div>

                    <!-- Fecha Asignación -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Fecha de Asignación</label>
                            <div class="input-container">
                                <i class="fa-solid fa-calendar-plus"></i>
                                <input type="datetime-local" th:field="*{fechaAsignacion}" class="form-control-custom" required />
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('fechaAsignacion')}" th:errors="*{fechaAsignacion}"></div>
                        </div>
                    </div>

                    <!-- Fecha Devolución Estimada -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Fecha de Devolución Estimada</label>
                            <div class="input-container">
                                <i class="fa-solid fa-calendar-clock"></i>
                                <input type="datetime-local" th:field="*{fechaDevolucionEstimada}" class="form-control-custom"/>
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('fechaDevolucionEstimada')}" th:errors="*{fechaDevolucionEstimada}"></div>
                        </div>
                    </div>

                    <!-- Estado -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Estado de la Asignación</label>
                            <div class="input-container">
                                <i class="fa-solid fa-circle-info"></i>
                                <select th:field="*{estado}" class="form-control-custom">
                                    <option th:each="est : ${estados}" th:value="${est}" th:text="${est}"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Kilometraje Inicial -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Kilometraje Inicial</label>
                            <div class="input-container">
                                <i class="fa-solid fa-gauge-high"></i>
                                <input type="number" th:field="*{kilometrajeInicial}" class="form-control-custom" min="0" />
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('kilometrajeInicial')}" th:errors="*{kilometrajeInicial}"></div>
                        </div>
                    </div>

                    <!-- Kilometros Recorridos -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Kilómetros Recorridos</label>
                            <div class="input-container">
                                <i class="fa-solid fa-route"></i>
                                <input type="number" th:field="*{kilometrosRecorridos}" class="form-control-custom" min="0" />
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('kilometrosRecorridos')}" th:errors="*{kilometrosRecorridos}"></div>
                        </div>
                    </div>

                    <!-- Kilometraje Final -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Kilometraje Final</label>
                            <div class="input-container">
                                <i class="fa-solid fa-flag-checkered"></i>
                                <input type="number" th:field="*{kilometrajeFinal}" class="form-control-custom" min="0" />
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('kilometrajeFinal')}" th:errors="*{kilometrajeFinal}"></div>
                        </div>
                    </div>

                    <!-- Fecha Devolución Real -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Fecha de Devolución Real</label>
                            <div class="input-container">
                                <i class="fa-solid fa-calendar-check"></i>
                                <input type="datetime-local" th:field="*{fechaDevolucion}" class="form-control-custom" />
                            </div>
                        </div>
                    </div>

                    <!-- Documento de Asignación -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Documento de Asignación</label>
                            <div class="input-container">
                                <i class="fa-solid fa-file-arrow-up"></i>
                                <input type="file" th:field="*{documento_asignacion}" id="archivo" class="form-control-custom" accept=".pdf,.jpg,.jpeg,.png" />
                            </div>
                            <small class="text-muted">Suba un nuevo documento para reemplazar el actual si existe.</small>
                        </div>
                    </div>
                </div>

                <div class="form-actions mt-4">
                    <a th:href="@{/asignacion/listado}" class="btn btn-secondary-custom text-decoration-none">
                        <i class="fa-solid fa-xmark"></i>
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Actualizar Asignación
                    </button>
                </div>
            </section>
        </form>
    </section>
    <script class="extra-scripts" src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script class="extra-scripts" th:inline="javascript">
        const vehiculoNombreInput = document.getElementById('vehiculoNombre');
        const vehiculoIdInput = document.getElementById('vehiculoId');
        const vehiculosList = document.getElementById('vehiculosList');

        const conductorNombreInput = document.getElementById('conductorNombre');
        const conductorIdInput = document.getElementById('conductorId');
        const conductoresList = document.getElementById('conductoresList');

        vehiculoNombreInput.addEventListener('input', function(e) {
            const val = e.target.value;
            const options = vehiculosList.options;
            vehiculoIdInput.value = ""; // Reset by default
            
            for (let i = 0; i < options.length; i++) {
                if (options[i].value === val) {
                    vehiculoIdInput.value = options[i].getAttribute('data-id');
                    break;
                }
            }
        });

        conductorNombreInput.addEventListener('input', function(e) {
            const val = e.target.value;
            const options = conductoresList.options;
            conductorIdInput.value = ""; // Reset by default
            
            for (let i = 0; i < options.length; i++) {
                if (options[i].value === val) {
                    conductorIdInput.value = options[i].getAttribute('data-id');
                    break;
                }
            }
        });

        // Al cargar la página, si hay un valor en vehiculoId/conductorId, intentar poner el nombre en el input correspondiente
        window.addEventListener('load', function() {
            const currentVehiculoId = vehiculoIdInput.value;
            if (currentVehiculoId) {
                const options = vehiculosList.options;
                for (let i = 0; i < options.length; i++) {
                    if (options[i].getAttribute('data-id') === currentVehiculoId) {
                        vehiculoNombreInput.value = options[i].value;
                        break;
                    }
                }
            }

            const currentConductorId = conductorIdInput.value;
            if (currentConductorId) {
                const options = conductoresList.options;
                for (let i = 0; i < options.length; i++) {
                    if (options[i].getAttribute('data-id') === currentConductorId) {
                        conductorNombreInput.value = options[i].value;
                        break;
                    }
                }
            }
        });

        document.getElementById("archivo").addEventListener("change", function () {
            const archivo = this.files[0];
            const maxSize = 10 * 1024 * 1024; // 10 MB


            if (archivo && archivo.size > maxSize) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Archivo demasiado grande',
                    text: 'El archivo seleccionado supera el tamaño máximo permitido de 10 MB.',
                    confirmButtonColor: '#004b81'
                });

                this.value = ""; // Limpia la selección
            }
        });

        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            var exito = /*[[${exito}]]*/ null;
            var error = /*[[${error}]]*/ null;

            if (exito) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Éxito!',
                    text: exito,
                    confirmButtonColor: '#004b81'
                });
            }

            if (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error,
                    confirmButtonColor: '#004b81'
                });
            }
        });
        /*]]>*/
    </script>
</body>
</html>
