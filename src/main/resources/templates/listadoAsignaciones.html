<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Gestión de Flota',
        currentPage='listadoAsignaciones',
        searchPlaceholder='Buscar por patente, modelo, conductor, legajo o DNI',
        topbar_action=~{:: .topbar-btn},
        content=~{:: .content-section},
        extra_css=~{},
        extra_scripts=~{:: script.extra-script},
        searchAction='/asignacion/listado'
      )}" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
</head>
<body>

    <a th:href="@{/asignacion/crear}" class="btn btn-primary-custom me-2 text-decoration-none topbar-btn" sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERARIO')">
        <i class="fa-solid fa-plus"></i>
        <span>Nueva <span class="d-none d-sm-inline">asignación</span></span>
    </a>

    <section class="panel mt-4 content-section">
        <!-- Filtros -->
        <div class="filters-bar">
            <form th:action="@{/asignacion/listado}" method="GET">
                <input type="hidden" name="buscar" th:value="${busqueda}">
                <div class="row g-3">
                    <div class="col-12 col-sm-6 col-lg-2">
                        <div class="filter-group">
                            <label>Fecha Desde</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-calendar-day"></i>
                                <input type="date" name="fechaDesde" th:value="${fechaDesde}" class="form-control-custom" placeholder="Desde">
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-2">
                        <div class="filter-group">
                            <label>Fecha Hasta</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-calendar-check"></i>
                                <input type="date" name="fechaHasta" th:value="${fechaHasta}" class="form-control-custom" placeholder="Hasta">
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-2">
                        <div class="filter-group">
                            <label>Fecha Particular</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-calendar"></i>
                                <input type="date" name="fechaParticular" th:value="${fechaParticular}" class="form-control-custom" placeholder="Fecha">
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="filter-group">
                            <label>Estado</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-circle-info"></i>
                                <select name="estado" class="form-select-custom">
                                    <option value="">Todos</option>
                                    <option th:each="est : ${estados}" 
                                            th:value="${est}" 
                                            th:text="${est}" 
                                            th:selected="${estadoSeleccionado == est}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-12 col-lg-3">
                        <div class="filter-group h-100 d-flex flex-column justify-content-end">
                            <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-auto">
                                <i class="fa-solid fa-filter"></i>
                                Filtrar
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="fleet-table table align-middle">
                <thead>
                <tr>
                    <th>N° de asignación</th>
                    <th>Vehículo</th>
                    <th class="d-none d-sm-table-cell">Empleado</th>
                    <th class="d-none d-md-table-cell">Estado</th>
                    <th class="d-none d-lg-table-cell">Fecha de asignación</th>
                    <th class="d-none d-lg-table-cell">Fecha de devolución estimada</th>
                    <th class="d-none d-lg-table-cell">Fecha de devolución real</th>
                    <th class="d-none d-lg-table-cell">Kilometraje inicial</th>
                    <th class="d-none d-lg-table-cell">Kilometros recorridos</th>
                    <th class="d-none d-lg-table-cell">Kilometraje final</th>
                    <th class="d-none d-lg-table-cell text-center">Acciones</th>
                </tr>
                </thead>

                <tbody th:if="${asignaciones != null}">
                <tr th:each="a : ${asignaciones}">
                    <td th:text="'#' + ${a.id}"></td>
                    <td>
                        <div class="desc-title" th:text="${a.vehiculo.modelo.nombreCompletoModelo}"></div>
                    </td>
                    <td class="d-none d-sm-table-cell" th:text="${a.conductor.nomApe}"></td>
                    <td>
                        <span class="badge badge-priority" 
                              th:classappend="${a.estado.name() == 'ACTIVA' ? 'activa verde' : (a.estado.name() == 'PENDIENTE' ? 'pendiente naranja' : 'finalizada rojo')}"
                              th:text="${a.estado}"></span>
                    </td>
                    <td class="d-none d-lg-table-cell" th:text="${#temporals.format(a.fechaAsignacion, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="d-none d-lg-table-cell" th:text="${#temporals.format(a.fechaDevolucionEstimada, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="d-none d-lg-table-cell" th:text="${a.fechaDevolucion != null ? #temporals.format(a.fechaDevolucion, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                    <td class="d-none d-lg-table-cell" th:text="${a.kilometrajeInicial}"></td>
                    <td class="d-none d-lg-table-cell" th:text="${#numbers.formatInteger(a.kilometrosRecorridos, 0, 'POINT')}"></td>
                    <td class="d-none d-lg-table-cell" th:text="${a.kilometrajeFinal != null ? #numbers.formatInteger(a.kilometrajeFinal, 0, 'POINT') : '-'}"></td>
                    <td class="d-none d-lg-table-cell text-center">
                        <a th:href="@{/asignacion/detalle/{id}(id=${a.id})}" class="text-info me-2" title="Ver detalle">
                            <i class="fa-solid fa-eye"></i>
                        </a>
                        <a th:href="@{/asignacion/modificar/{id}(id=${a.id})}" class="text-primary" title="Modificar" sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERARIO')">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="panel-footer mt-auto d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3" sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERARIO')">
            <p class="m-0">
                Mostrando asignaciones del <span th:text="${paginaActual * tamanioPagina + 1}"></span>
                al <span th:text="${(paginaActual + 1) * tamanioPagina > totalItems ? totalItems : (paginaActual + 1) * tamanioPagina}"></span>
                de un total de <span th:text="${totalItems}"></span>
            </p>
            <nav aria-label="Page navigation" th:if="${totalPages > 1}">
                <ul class="pagination m-0"
                    th:with="maxPaginas=5,
                 mitad=${maxPaginas / 2},
                 inicio=${paginaActual - mitad < 0 ? 0 : (paginaActual + mitad >= totalPages ? totalPages - maxPaginas : paginaActual - mitad)},
                 final=${paginaActual + mitad >= totalPages ? totalPages - 1 : (paginaActual - mitad < 0 ? (maxPaginas > totalPages ? totalPages - 1 : maxPaginas - 1) : paginaActual + mitad)},
                 inicioReal=${inicio < 0 ? 0 : inicio}">

                    <li class="page-item" th:classappend="${paginaActual == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/asignacion/listado(page=0, buscar=${busqueda}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta}, fechaParticular=${fechaParticular}, estado=${estadoSeleccionado})}" title="Primera página">
                            <i class="fa-solid fa-angles-left"></i>
                        </a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/asignacion/listado(page=${paginaActual - 1}, buscar=${busqueda}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta}, fechaParticular=${fechaParticular}, estado=${estadoSeleccionado})}">Anterior</a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(inicioReal, final)}"
                        th:classappend="${paginaActual == i ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/asignacion/listado(page=${i}, buscar=${busqueda}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta}, fechaParticular=${fechaParticular}, estado=${estadoSeleccionado})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual + 1 == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/asignacion/listado(page=${paginaActual + 1}, buscar=${busqueda}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta}, fechaParticular=${fechaParticular}, estado=${estadoSeleccionado})}">Siguiente</a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual + 1 == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/asignacion/listado(page=${totalPages - 1}, buscar=${busqueda}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta}, fechaParticular=${fechaParticular}, estado=${estadoSeleccionado})}" title="Última página">
                            <i class="fa-solid fa-angles-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
            <a th:href="@{/asignacion/exportar/excel(buscar=${busqueda}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta}, fechaParticular=${fechaParticular}, estado=${estadoSeleccionado})}"
               class="btn btn-success me-2 text-decoration-none">
                <i class="fa-solid fa-file-excel"></i>
                <span>Exportar <span class="d-none d-sm-inline">Excel</span></span>
            </a>
        </div>
    </section>
    <script class="extra-script" src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script class="extra-script" th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            const exito = /*[[${exito}]]*/ null;
            if (exito) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Éxito!',
                    text: exito,
                    confirmButtonColor: '#004b81'
                });
            }
        });
        /*]]>*/
    </script>
</body>
</html>
