<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Editar Conductor - Gestión de Flota',
        currentPage='conductores',
        searchPlaceholder=null,
        topbar_action=~{},
        content=~{:: .content-section},
        extra_css=~{:: link.extra-css},
        extra_scripts=~{}
      )}">
<head>
    <link class="extra-css" rel="stylesheet" th:href="@{/css/modificarConductor.css}" />
</head>
<body>

    <section class="panel mt-4 content-section">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/conductor/modificar/{id}(id=${id})}" th:object="${conductorDto}" method="POST" autocomplete="off">
            <section class="panel">
                <h2 class="panel-title">
                    <i class="fa-solid fa-user-pen"></i>
                    Editar Datos del Conductor
                </h2>
                <div class="row">
                    <!-- Datos Personales -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Nombre y Apellido</label>
                            <div class="input-container">
                                <i class="fa-solid fa-user"></i>
                                <input type="text" class="form-control-custom" placeholder="Ej: Juan Pérez" required th:field="*{nomApe}" autocomplete="off">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label class="form-label">DNI</label>
                            <div class="input-container">
                                <i class="fa-solid fa-id-card"></i>
                                <input type="text" class="form-control-custom" placeholder="Número de documento" required th:field="*{dni}" maxlength="8" pattern="\d{1,8}" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8);" autocomplete="off">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="form-group">
                            <label class="form-label">Legajo</label>
                            <div class="input-container">
                                <i class="fa-solid fa-file-invoice"></i>
                                <input type="text" class="form-control-custom" placeholder="Número de legajo" required th:field="*{legajo}" maxlength="4" pattern="\d{1,4}" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);" autocomplete="off">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Correo Electrónico</label>
                            <div class="input-container">
                                <i class="fa-solid fa-envelope"></i>
                                <input type="email" class="form-control-custom" placeholder="ejemplo@biosidus.com" required th:field="*{mail}" autocomplete="off">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Rango</label>
                            <div class="input-container">
                                <i class="fa-solid fa-building"></i>
                                <select class="form-select-custom" required th:field="*{rango}">
                                    <option value="" disabled selected>Seleccionar rango</option>
                                    <option th:each="r : ${rangos}" th:value="${r}" th:text="${r}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel">
                <!-- Datos de Usuario -->
                <h2 class="panel-title">
                    <i class="fa-solid fa-key"></i>
                    Datos de Acceso
                </h2>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Nickname</label>
                            <div class="input-container">
                                <i class="fa-solid fa-user-tag"></i>
                                <input type="text" class="form-control-custom" placeholder="Nombre de usuario" required th:field="*{nickname}" autocomplete="one-time-code">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Tipo de Usuario (Rol)</label>
                            <div class="input-container">
                                <i class="fa-solid fa-shield-halved"></i>
                                <select class="form-select-custom" required th:field="*{rol}">
                                    <option value="" disabled selected>Seleccionar tipo</option>
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${#strings.capitalize(#strings.toLowerCase(r))}"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Nueva Contraseña (opcional)</label>
                            <div class="input-container">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" class="form-control-custom" placeholder="Dejar en blanco para no cambiar" th:field="*{contrasena}" autocomplete="new-password">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Verificar Contraseña</label>
                            <div class="input-container">
                                <i class="fa-solid fa-lock-open"></i>
                                <input type="password" class="form-control-custom" placeholder="********" th:field="*{verificacionContrasena}" autocomplete="new-password">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-actions mt-4">
                    <a th:href="@{/conductor/listado}" class="btn btn-secondary-custom text-decoration-none">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary-custom px-4">
                        <i class="fa-solid fa-save"></i>
                        Actualizar Conductor
                    </button>
                </div>
            </section>
        </form>
    </section>

</body>
</html>
