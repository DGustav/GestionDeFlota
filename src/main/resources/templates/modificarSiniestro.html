<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Modificar Siniestro - Gestión de Flota',
        currentPage='siniestros',
        searchPlaceholder=null,
        topbar_action=~{},
        content=~{:: .content-section},
        extra_css=~{:: link.extra-css},
        extra_scripts=~{}
      )}">
<head>
    <link class="extra-css" rel="stylesheet" th:href="@{/css/crearAsignacion.css}" />
</head>
<body>

    <section class="panel mt-4 content-section">
        <h2 class="panel-title">
            <i class="fa-solid fa-pen-to-square"></i>
            Modificar Siniestro #1
        </h2>

        <form action="#" method="POST" enctype="multipart/form-data">
            <div class="row g-4">
                <!-- Asignación / Contexto -->
                <div class="col-12 col-md-6">
                    <div class="form-group">
                        <label class="form-label">Asignación Relacionada (Solo Lectura)</label>
                        <input type="text" class="form-control-custom" value="Ford Mustang (AB 123 CD) - Gustavo Porcel" disabled>
                    </div>
                </div>

                <!-- Fecha del Siniestro -->
                <div class="col-12 col-md-6">
                    <div class="form-group">
                        <label class="form-label">Fecha y Hora del Siniestro</label>
                        <input type="datetime-local" class="form-control-custom" name="fechaSiniestro" value="2026-03-15T10:30" required>
                    </div>
                </div>

                <!-- Descripción -->
                <div class="col-12">
                    <div class="form-group">
                        <label class="form-label">Descripción del Siniestro</label>
                        <textarea class="form-control-custom" name="descripcion" rows="4" required>Choque leve en estacionamiento contra pilar de hormigón.</textarea>
                    </div>
                </div>

                <!-- Pruebas / Archivos -->
                <div class="col-12">
                    <div class="form-group">
                        <label class="form-label">Pruebas Adjuntas</label>
                        <div class="list-group mb-3">
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span>
                                    <i class="fa-solid fa-image me-2"></i>
                                    <a th:href="@{/descargarPrueba/1/foto_delantera_1.jpg}" class="text-decoration-none" download>foto_delantera_1.jpg</a>
                                </span>
                                <button class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span>
                                    <i class="fa-solid fa-file-pdf me-2"></i>
                                    <a th:href="@{/descargarPrueba/1/informe_danos.pdf}" class="text-decoration-none" download>informe_danos.pdf</a>
                                </span>
                                <button class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        
                        <label class="form-label">Agregar más pruebas</label>
                        <div class="input-group">
                            <input type="file" class="form-control-custom" name="pruebas" multiple accept="image/*,.pdf">
                        </div>
                        <small class="text-muted">Puede seleccionar varios archivos adicionales.</small>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="col-12 d-flex justify-content-end gap-3 mt-4">
                    <a th:href="@{/siniestro/listado}" class="btn btn-secondary-custom text-decoration-none">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="fa-solid fa-save"></i>
                        Actualizar Siniestro
                    </button>
                </div>
            </div>
        </form>
    </section>

</body>
</html>
