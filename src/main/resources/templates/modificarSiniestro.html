<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Modificar Siniestro - Gestión de Flota',
        currentPage='siniestros',
        searchPlaceholder=null,
        topbar_action=~{},
        content=~{:: .content-section},
        extra_css=~{:: .extra-css},
        extra_scripts=~{:: script.extra-scripts}
      )}">
<head>
    <link class="extra-css" rel="stylesheet" th:href="@{/css/crearVehiculo.css}" />

    <style class="extra-css">
        .prueba-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .file-icon {
            font-size: 2.5rem;
            color: #6c757d;
        }

        .prueba-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 110px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            text-decoration: none;
            color: inherit;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.07);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .prueba-card:hover {
            box-shadow: 0 10px 20px rgba(0,0,0,0.12),
            0 6px 6px rgba(0,0,0,0.1);
            border-color: #004b81;
            transform: translateY(-4px);
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>

<section class="panel mt-4 content-section">

    <h2 class="panel-title">
        <i class="fa-solid fa-pen-to-square"></i>
        Modificar Siniestro #
        <span th:text="${siniestro.id}">1</span>
    </h2>

    <form th:action="@{/siniestro/modificar/{id}(id=${siniestro.id})}"
          th:object="${siniestro}"
          method="POST"
          enctype="multipart/form-data">

        <div th:if="${#fields.hasAnyErrors() || (error != null)}"
             class="alert alert-danger alert-dismissible fade show"
             role="alert">

            <div th:each="err : ${#fields.allErrors()}"
                 th:text="${err} + '.'"></div>

            <div th:if="${error != null}"
                 th:text="${error}"></div>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close"></button>
        </div>

        <div class="row g-4">

            <!-- Vehículo / Conductor -->
            <div class="col-12 col-md-6">
                <div class="form-group">

                    <label class="form-label">
                        Vehículo (Lectura)
                    </label>

                    <div class="input-container">
                        <i class="fa-solid fa-car"></i>

                        <input type="text"
                               class="form-control-custom"
                               th:value="${siniestro.nombreVehiculo}"
                               disabled>
                        <input type="hidden"
                               th:field="${siniestro.vehiculoId}"
                               id="vehiculoId">
                    </div>
                </div>
            </div>

            <!-- Fecha -->
            <div class="col-12 col-md-6">
                <div class="form-group">

                    <label class="form-label">
                        Fecha del Siniestro
                    </label>

                    <div class="input-container">
                        <i class="fa-solid fa-calendar-day"></i>

                        <input type="datetime-local"
                               th:field="*{fechaSiniestro}"
                               class="form-control-custom"
                               required>
                    </div>
                </div>
            </div>

            <!-- Descripción -->
            <div class="col-12">
                <div class="form-group">

                    <label class="form-label">
                        Descripción del Siniestro
                    </label>

                    <textarea th:field="*{descripcion}"
                              class="form-control-custom"
                              rows="4"
                              required></textarea>
                </div>
            </div>

            <!-- Pruebas -->
            <div class="col-12 mt-4">

                <h6 class="border-bottom pb-2 mb-3">
                    Pruebas / Documentación
                </h6>

                <div th:if="${siniestroOriginal.pruebas != null and !siniestroOriginal.pruebas.isEmpty()}"
                     class="prueba-container">

                    <div th:each="prueba : ${siniestroOriginal.pruebas}">

                        <a th:href="@{/siniestro/descargar-prueba(ruta=${prueba})}"
                           target="_blank"
                           class="prueba-card">

                            <th:block th:with="extension=${#strings.toLowerCase(#strings.substringAfter(prueba, '.'))}">

                                <i th:if="${extension == 'pdf'}"
                                   class="fa-solid fa-file-pdf file-icon text-danger"></i>

                                <i th:if="${extension == 'doc' || extension == 'docx'}"
                                   class="fa-solid fa-file-word file-icon text-primary"></i>

                                <i th:if="${extension == 'xls' || extension == 'xlsx'}"
                                   class="fa-solid fa-file-excel file-icon text-success"></i>

                                <i th:if="${extension == 'jpg' || extension == 'jpeg' || extension == 'png' || extension == 'gif'}"
                                   class="fa-solid fa-file-image file-icon text-info"></i>

                                <i th:if="${extension != 'pdf'
                                        && extension != 'doc'
                                        && extension != 'docx'
                                        && extension != 'xls'
                                        && extension != 'xlsx'
                                        && extension != 'jpg'
                                        && extension != 'jpeg'
                                        && extension != 'png'
                                        && extension != 'gif'}"
                                   class="fa-solid fa-file-lines file-icon"></i>

                            </th:block>

                            <span class="mt-2 text-center px-2"
                                  style="font-size: 0.75rem;
                                         word-break: break-all;
                                         max-width: 100%;
                                         line-height: 1.1;"
                                  th:text="${#strings.substringAfter(prueba, '_')}">

                                archivo.pdf

                            </span>

                        </a>

                    </div>

                </div>

                <div th:unless="${siniestroOriginal.pruebas != null and !siniestroOriginal.pruebas.isEmpty()}"
                     class="mb-4">

                    <p class="text-muted italic bg-light p-3 rounded shadow-sm border">
                        No se adjuntaron pruebas para este siniestro.
                    </p>

                </div>

                <!-- Agregar archivos -->
                <label class="form-label fw-bold mb-2">
                    Agregar más pruebas
                </label>

                <div class="d-flex align-items-center gap-3 flex-wrap">

                    <button type="button"
                            class="btn btn-outline-primary"
                            onclick="document.getElementById('pruebasArchivos').click();">

                        <i class="fa-solid fa-paperclip me-2"></i>
                        Seleccionar archivos

                    </button>

                    <span class="text-muted small">
                        Puede seleccionar múltiples archivos.
                    </span>

                </div>

                <input type="file"
                       id="pruebasArchivos"
                       th:field="*{pruebasArchivos}"
                       multiple
                       hidden
                       onchange="actualizarListaArchivos(this)">

                <div id="lista-archivos-nuevos"
                     class="mt-3 small text-primary fw-bold"></div>

            </div>

            <!-- Botones -->
            <div class="col-12 d-flex justify-content-end gap-3 mt-4">

                <a th:href="@{/siniestro/listado}"
                   class="btn btn-secondary-custom text-decoration-none">

                    Cancelar

                </a>

                <button type="submit"
                        class="btn btn-primary-custom">

                    <i class="fa-solid fa-save"></i>
                    Actualizar Siniestro

                </button>

            </div>

        </div>
    </form>
</section>

<script class="extra-scripts"
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script class="extra-scripts" th:inline="javascript">

    function actualizarListaArchivos(input) {

        const lista = document.getElementById('lista-archivos-nuevos');

        if (input.files.length > 0) {

            let nombres = Array.from(input.files)
                .map(f => f.name)
                .join(', ');

            lista.innerHTML =
                '<i class="fa-solid fa-paperclip me-1"></i> ' +
                'Archivos seleccionados: ' + nombres;

        } else {

            lista.innerHTML = '';

        }
    }

    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function () {

        var exito = /*[[${exito}]]*/ null;
        var error = /*[[${error}]]*/ null;

        if (exito) {

            Swal.fire({
                icon: 'success',
                title: '¡Éxito!',
                text: exito,
                confirmButtonColor: '#004b81'
            });

        }

        if (error) {

            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: error,
                confirmButtonColor: '#004b81'
            });

        }
    });
    /*]]>*/

</script>

</body>
</html>
