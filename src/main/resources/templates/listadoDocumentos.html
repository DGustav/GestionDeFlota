<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Listado de Documentos - Gestión de Flota',
        currentPage='documentos',
        searchPlaceholder='Buscar documentos (tipo, vehículo, conductor...)',
        topbar_action=~{:: .topbar-btn},
        content=~{:: .content-section},
        extra_css=~{},
        extra_scripts=~{}
      )}">
<head>
</head>
<body>

    <a th:href="@{/crearDocumento}" class="btn btn-primary-custom me-2 text-decoration-none topbar-btn">
        <i class="fa-solid fa-plus"></i>
        <span>Nuevo <span class="d-none d-sm-inline">documento</span></span>
    </a>

    <section class="panel mt-4 content-section">
        <!-- Filtros -->
        <div class="filters-bar">
            <div class="row g-3">
                <div class="col-12 col-sm-4 col-lg-2">
                    <div class="filter-group">
                        <label>Tipo</label>
                        <div class="filter-input-group">
                            <i class="fa-solid fa-file-invoice"></i>
                            <select class="form-select-custom">
                                <option value="" disabled selected>Seleccionar tipo</option>
                                <option value="VTV">VTV</option>
                                <option value="CEDULA">Cédula</option>
                                <option value="SEGURO">Seguro</option>
                                <option value="LICENCIA">Licencia</option>
                                <option value="MULTA">Multa</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-4 col-lg-2">
                    <div class="filter-group">
                        <label>Vehículo</label>
                        <div class="filter-input-group">
                            <i class="fa-solid fa-car"></i>
                            <input type="text" class="form-control-custom form-multi-select" list="vehiculosList" placeholder="Seleccionar vehículo">
                            <datalist id="vehiculosList">
                                <option value="ABC-123 (Toyota Corolla)">
                                <option value="XYZ-789 (Ford Ranger)">
                            </datalist>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-4 col-lg-2">
                    <div class="filter-group">
                        <label>Conductor</label>
                        <div class="filter-input-group">
                            <i class="fa-solid fa-user-tie"></i>
                            <input type="text" class="form-control-custom form-multi-select" list="conductoresList" placeholder="Seleccionar conductor">
                            <datalist id="conductoresList">
                                <option value="Juan Pérez">
                                <option value="María García">
                            </datalist>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-4 col-lg-2">
                    <div class="filter-group">
                        <label>Estado</label>
                        <div class="filter-input-group">
                            <i class="fa-solid fa-circle-info"></i>
                            <select class="form-select-custom">
                                <option value="" disabled selected>Seleccionar estado</option>
                                <option value="VIGENTE">VIGENTE</option>
                                <option value="VENCIDO">VENCIDO</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-4 col-lg-2">
                    <div class="filter-group h-100 d-flex flex-column justify-content-end">
                        <button class="btn btn-primary-custom w-100 py-2 mt-auto">
                            <i class="fa-solid fa-filter"></i>
                            Filtrar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="fleet-table table align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tipo de Documento</th>
                    <th>Vencimiento</th>
                    <th>Asociado a</th>
                    <th class="d-none d-lg-table-cell">Estado</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <!-- Ejemplo de dato estático para previsualización -->
                <tr>
                    <td>1</td>
                    <td>
                        <div class="desc-title">VTV</div>
                    </td>
                    <td>15/12/2026</td>
                    <td>Vehículo: ABC-123</td>
                    <td class="d-none d-lg-table-cell">
                        <span class="badge bg-success">Vigente</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/detalleDocumento/1}" class="text-info me-2"><i class="fa-solid fa-eye"></i></a>
                        <a th:href="@{/modificarDocumento/1}" class="text-primary me-2"><i class="fa-solid fa-pen-to-square"></i></a>
                        <a href="#" class="text-info" download><i class="fa-solid fa-download"></i></a>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>
                        <div class="desc-title">LICENCIA</div>
                    </td>
                    <td>01/03/2024</td>
                    <td>Conductor: Juan Pérez</td>
                    <td class="d-none d-lg-table-cell">
                        <span class="badge bg-danger">Vencido</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/detalleDocumento/2}" class="text-info me-2"><i class="fa-solid fa-eye"></i></a>
                        <a th:href="@{/modificarDocumento/2}" class="text-primary me-2"><i class="fa-solid fa-pen-to-square"></i></a>
                        <a th:href="@{/descargarPrueba/2/foto_delantera_1.jpg}" class="text-info" download=""><i class="fa-solid fa-download"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="panel-footer mt-auto d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
            <p class="m-0">2 documentos en total</p>
            <nav aria-label="Page navigation example">
                <ul class="pagination">
                    <li class="page-item"><a class="page-link" href="#">Anterior</a></li>
                    <li class="page-item active" aria-current="page"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">Siguiente</a></li>
                </ul>
            </nav>
            <button class="btn btn-primary-custom btn-report">
                <i class="fa-solid fa-print"></i>
                Imprimir reporte
            </button>
        </div>
    </section>

</body>
</html>
