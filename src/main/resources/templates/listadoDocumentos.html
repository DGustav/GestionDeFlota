<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Listado de Documentos - Gestión de Flota',
        currentPage='documentos',
        searchPlaceholder='Buscar documentos (patente del vehiculo, nombre y apellido, legajo o usuario del conductor)',
        searchAction=${searchAction},
        topbar_action=~{:: .topbar-btn},
        content=~{:: .content-section},
        extra_css=~{},
        extra_scripts=~{:: script.extra-script}
      )}" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
</head>
<body>

    <a th:href="@{/documento/crear}" class="btn btn-primary-custom me-2 text-decoration-none topbar-btn" sec:authorize="hasAnyRole('ADMINISTRADOR','OPERARIO')">
        <i class="fa-solid fa-plus"></i>
        <span>Nuevo <span class="d-none d-sm-inline">documento</span></span>
    </a>

    <section class="panel mt-4 content-section">
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            <span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Filtros -->
        <div class="filters-bar mt-3">
            <form th:action="@{/documento/listado}" method="GET">
                <div class="row g-3">
                    <div class="col-12 col-sm-6 col-lg-4">
                        <div class="filter-group">
                            <label>Estado</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-info-circle"></i>
                                <input type="hidden" name="buscar" th:value="${busqueda}" />
                                <select name="estado" class="form-control-custom">
                                    <option value="">Todos los estados</option>
                                    <option th:each="e : ${estados}" 
                                            th:value="${e}" 
                                            th:text="${e}"
                                            th:selected="${e == estadoSeleccionado}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-4">
                        <div class="filter-group">
                            <label>Tipo de Documento</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-file-lines"></i>
                                <select name="tipo" class="form-control-custom">
                                    <option value="">Todos los tipos</option>
                                    <option th:each="t : ${tipos}" 
                                            th:value="${t}" 
                                            th:text="${t}"
                                            th:selected="${t == tipoSeleccionado}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-lg-4">
                        <div class="filter-group h-100 d-flex flex-column justify-content-end">
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary-custom w-100 py-2">
                                    <i class="fa-solid fa-filter"></i>
                                    Filtrar
                                </button>
                                <a th:href="@{/documento/listado}" class="btn btn-secondary w-100 py-2" style="background-color: #6c757d; color: white; border: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-decoration: none;">
                                    <i class="fa-solid fa-eraser me-2"></i>
                                    Limpiar
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div class="table-responsive mt-3">
            <table class="fleet-table table align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tipo de Documento</th>
                    <th>Vencimiento</th>
                    <th>Asociado a</th>
                    <th class="d-none d-lg-table-cell">Estado</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="doc : ${documentos}">
                    <td th:text="${doc.id}"></td>
                    <td>
                        <div class="desc-title" th:text="${doc.tipoDocumento}"></div>
                    </td>
                    <td th:text="${#temporals.format(doc.fechaVencimiento, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span th:if="${doc.vehiculo != null}">
                            <i class="fa-solid fa-car me-1"></i>
                            <span th:text="${'Vehículo: ' + doc.vehiculo.patente}"></span>
                        </span>
                        <span th:if="${doc.conductor != null}">
                            <i class="fa-solid fa-user-tie me-1"></i>
                            <span th:text="${'Conductor: ' + doc.conductor.nomApe}"></span>
                        </span>
                    </td>
                    <td class="d-none d-lg-table-cell">
                            <span class="badge"
                                  th:classappend="${
                                      doc.estadoDocumento.name() == 'VIGENTE' ? 'bg-success' :
                                      (doc.estadoDocumento.name() == 'POR_VENCER' ? 'bg-warning text-dark' : 'bg-danger')
                                  }"
                                  th:text="${doc.estadoDocumento}">
                            </span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/documento/detalle/{id}(id=${doc.id})}" class="text-info me-2"><i class="fa-solid fa-eye"></i></a>

                        <a th:href="@{/documento/modificar/{id}(id=${doc.id})}" class="text-primary me-2" sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERARIO')"><i class="fa-solid fa-pen-to-square"></i></a>
                        <a th:href="@{/documento/descargar/{id}(id=${doc.id})}" class="text-info"><i class="fa-solid fa-download"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(documentos)}">
                    <td colspan="6" class="text-center">No se encontraron documentos</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="panel-footer mt-auto d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
            <p class="m-0">
                Mostrando documentos del <span th:text="${paginaActual * tamanioPagina + 1}"></span>
                al <span th:text="${(paginaActual + 1) * tamanioPagina > totalItems ? totalItems : (paginaActual + 1) * tamanioPagina}"></span>
                de un total de <span th:text="${totalItems}"></span>
            </p>
            <nav aria-label="Page navigation" th:if="${totalPages > 1}">
                <ul class="pagination m-0"
                    th:with="maxPaginas=5,
                 mitad=${maxPaginas / 2},
                 inicio=${paginaActual - mitad < 0 ? 0 : (paginaActual + mitad >= totalPages ? totalPages - maxPaginas : paginaActual - mitad)},
                 final=${paginaActual + mitad >= totalPages ? totalPages - 1 : (paginaActual - mitad < 0 ? (maxPaginas > totalPages ? totalPages - 1 : maxPaginas - 1) : paginaActual + mitad)},
                 inicioReal=${inicio < 0 ? 0 : inicio}">

                    <li class="page-item" th:classappend="${paginaActual == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/documento/listado(page=0, estado=${estadoSeleccionado}, tipo=${tipoSeleccionado}, buscar=${busqueda})}" title="Primera página">
                            <i class="fa-solid fa-angles-left"></i>
                        </a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/documento/listado(page=${paginaActual - 1}, estado=${estadoSeleccionado}, tipo=${tipoSeleccionado}, buscar=${busqueda})}">Anterior</a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(inicioReal, final)}"
                        th:classappend="${paginaActual == i ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/documento/listado(page=${i}, estado=${estadoSeleccionado}, tipo=${tipoSeleccionado}, buscar=${busqueda})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual + 1 == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/documento/listado(page=${paginaActual + 1}, estado=${estadoSeleccionado}, tipo=${tipoSeleccionado}, buscar=${busqueda})}">Siguiente</a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual + 1 == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/documento/listado(page=${totalPages - 1}, estado=${estadoSeleccionado}, tipo=${tipoSeleccionado}, buscar=${busqueda})}" title="Última página">
                            <i class="fa-solid fa-angles-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
            <a th:href="@{/documento/exportar/excel(estado=${estadoSeleccionado}, tipo=${tipoSeleccionado}, buscar=${busqueda})}"
               class="btn btn-success me-2 text-decoration-none">
                <i class="fa-solid fa-file-excel"></i>
                <span>Exportar <span class="d-none d-sm-inline">Excel</span></span>
            </a>
        </div>
    </section>

<script class="extra-script" src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script class="extra-script" th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function() {
        var exito = /*[[${exito}]]*/ null;
        var error = /*[[${error}]]*/ null;

        if (exito) {
            Swal.fire({
                icon: 'success',
                title: '¡Éxito!',
                text: exito,
                confirmButtonColor: '#004b81'
            });
        }

        if (error) {
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: error,
                confirmButtonColor: '#004b81'
            });
        }
    });
    /*]]>*/
</script>
</body>
</html>
