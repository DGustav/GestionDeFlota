<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Listado de Vehículos - Gestión de Flota',
        currentPage='vehiculos',
        searchPlaceholder='Buscar vehículos (patente, marca, modelo...)',
        topbar_action=~{:: .topbar-btn},
        content=~{:: .content-section},
        extra_css=~{},
        extra_scripts=~{}
      )}">
<head>
</head>
<body>

    <a th:href="@{/crearVehiculo}" class="btn btn-primary-custom me-2 text-decoration-none topbar-btn">
        <i class="fa-solid fa-plus"></i>
        <span>Nuevo <span class="d-none d-sm-inline">vehículo</span></span>
    </a>

    <section class="panel mt-4 content-section">
        <div class="table-responsive">
            <table class="fleet-table table align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Patente</th>
                    <th>Marca y Modelo</th>
                    <th class="d-none d-sm-table-cell">Año</th>
                    <th class="d-none d-md-table-cell">Kilometraje</th>
                    <th class="d-none d-lg-table-cell">Leasing</th>
                    <th class="d-none d-lg-table-cell">Estado</th>
                    <th class="d-none d-lg-table-cell">Último Service</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <!-- Ejemplo de dato estático para previsualización -->
                <tr>
                    <td>1</td>
                    <td>
                        <div class="desc-title">ABC-123</div>
                    </td>
                    <td>Toyota Corolla</td>
                    <td class="d-none d-sm-table-cell">2022</td>
                    <td class="d-none d-md-table-cell">15.000 km</td>
                    <td class="d-none d-lg-table-cell">
                        <span class="badge text-dark">Sí</span>
                    </td>
                    <td class="d-none d-lg-table-cell">
                        <span class="badge bg-success">Disponible</span>
                    </td>
                    <td class="d-none d-lg-table-cell">10/01/2024</td>
                    <td class="text-center">
                        <a th:href="@{/detalleVehiculo/1}" class="text-info me-2" title="Ver detalle">
                            <i class="fa-solid fa-eye"></i>
                        </a>
                        <a th:href="@{/modificarVehiculo/1}" class="text-primary" title="Modificar">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="panel-footer mt-auto d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
            <p class="m-0">1 vehículos en total</p>
            <nav aria-label="Page navigation example">
                <ul class="pagination">
                    <li class="page-item"><a class="page-link" href="#">Anterior</a></li>
                    <li class="page-item active" aria-current="page"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">Siguiente</a></li>
                </ul>
            </nav>
            <button class="btn btn-primary-custom btn-report">
                <i class="fa-solid fa-print"></i>
                Imprimir reporte
            </button>
        </div>
    </section>

</body>
</html>
