<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Listado de Vehículos - Gestión de Flota',
        currentPage='vehiculos',
        searchPlaceholder='Buscar vehículos (patente, marca, modelo...)',
        topbar_action=~{:: .topbar-btn},
        content=~{:: .content-section},
        extra_css=~{},
        extra_scripts=~{:: script.extra-script},
        searchAction='/vehiculo/listado'
      )}">
<head>
</head>
<body>

    <a th:href="@{/vehiculo/crear}" class="btn btn-primary-custom me-2 text-decoration-none topbar-btn">
        <i class="fa-solid fa-plus"></i>
        <span>Nuevo <span class="d-none d-sm-inline">vehículo</span></span>
    </a>

    <section class="panel mt-4 content-section">
        <!-- Filtros -->
        <div class="filters-bar">
            <form th:action="@{/vehiculo/listado}" method="GET">
                <input type="hidden" name="buscar" th:value="${busqueda}">
                <div class="row g-3">
                    <div class="col-12 col-sm-4 col-lg-2">
                        <div class="filter-group">
                            <label>Tipo</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-car"></i>
                                <select name="tipoVehiculo" class="form-select-custom">
                                    <option value="" th:selected="${tipoVehiculoSeleccionado == null}">Todos</option>
                                    <option th:each="tipo : ${tiposVehiculo}" 
                                            th:value="${tipo}" 
                                            th:text="${#strings.replace(tipo, '_', ' ')}" 
                                            th:selected="${tipoVehiculoSeleccionado == tipo}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-4 col-lg-3">
                        <div class="filter-group">
                            <label>Disponibilidad</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-circle-info"></i>
                                <select name="disponible" class="form-select-custom">
                                    <option value="" th:selected="${disponible == null}">Todos</option>
                                    <option value="true" th:selected="${disponible == true}">Disponible</option>
                                    <option value="false" th:selected="${disponible == false}">No Disponible</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-4 col-lg-2">
                        <div class="filter-group">
                            <label>Estado</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-signal"></i>
                                <select name="estado" class="form-select-custom">
                                    <option value="" th:selected="${estadoSeleccionado == null}">Todos</option>
                                    <option th:each="est : ${estados}" 
                                            th:value="${est}" 
                                            th:text="${est}" 
                                            th:selected="${estadoSeleccionado == est}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-4 col-lg-2">
                        <div class="filter-group">
                            <label>Origen</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-earth-americas"></i>
                                <select name="origen" class="form-select-custom">
                                    <option value="" th:selected="${origenSeleccionado == null}">Todos</option>
                                    <option th:each="orig : ${origenes}" 
                                            th:value="${orig}" 
                                            th:text="${#strings.replace(orig, '_', ' ')}" 
                                            th:selected="${origenSeleccionado == orig}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-4 col-lg-2">
                        <div class="filter-group">
                            <label>Propietario</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-building"></i>
                                <select name="propietario" class="form-select-custom">
                                    <option value="" th:selected="${propietarioSeleccionado == null}">Todos</option>
                                    <option th:each="prop : ${propietarios}" 
                                            th:value="${prop}" 
                                            th:text="${#strings.replace(prop, '_', ' ')}" 
                                            th:selected="${propietarioSeleccionado == prop}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-4 col-lg-1">
                        <div class="filter-group h-100 d-flex flex-column justify-content-end">
                            <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-auto">
                                <i class="fa-solid fa-filter"></i>
                                Filtrar
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="fleet-table table align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Patente</th>
                    <th>Marca y Modelo</th>
                    <th>Tipo</th>
                    <th>Año</th>
                    <th class="d-none d-lg-table-cell">Disponibilidad</th>
                    <th class="d-none d-lg-table-cell">Estado</th>
                    <th class="d-none d-lg-table-cell">Propietario</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="vehiculo : ${vehiculos}">
                    <td th:text="${vehiculo.id}">1</td>
                    <td>
                        <div class="desc-title" th:if="${#strings.length(vehiculo.patente) == 6}" th:text="${#strings.substring(vehiculo.patente,0,3) + '-' + #strings.substring(vehiculo.patente,3,6)}">ABC-123</div>
                        <div class="desc-title" th:if="${#strings.length(vehiculo.patente) == 7}" th:text="${#strings.substring(vehiculo.patente,0,2) + '-' + #strings.substring(vehiculo.patente,2,5)+ '-' + #strings.substring(vehiculo.patente,5,7)}">ABC-123</div>
                    </td>
                    <td th:text="${vehiculo.modelo != null ? vehiculo.modelo.nombreCompletoModelo : 'N/A'}">Toyota Corolla</td>
                    <td th:text="${vehiculo.modelo != null && vehiculo.modelo.tipoVehiculo != null ? #strings.replace(vehiculo.modelo.tipoVehiculo, '_', ' ') : 'N/A'}">SEDAN</td>
                    <td th:text="${vehiculo.modelo != null ? vehiculo.modelo.anio : 'N/A'}">2022</td>
                    <td class="d-none d-lg-table-cell">
                        <span class="badge" 
                              th:classappend="${vehiculo.disponible ? 'bg-success' : 'bg-danger'}" 
                              th:text="${vehiculo.disponible ? 'Disponible' : 'No Disp.'}">Disponible</span>
                    </td>
                    <td class="d-none d-lg-table-cell">
                        <span class="badge bg-secondary" th:text="${vehiculo.estado}">ACTIVO</span>
                    </td>
                    <td class="d-none d-lg-table-cell">
                        <span class="badge bg-info text-dark" th:text="${vehiculo.propietario != null ? #strings.replace(vehiculo.propietario, '_', ' ') : 'N/A'}">BIOSIDUS</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/vehiculo/detalle/{id}(id=${vehiculo.id})}" class="text-info me-2" title="Ver detalle">
                            <i class="fa-solid fa-eye"></i>
                        </a>
                        <a th:href="@{/vehiculo/modificar/{id}(id=${vehiculo.id})}" class="text-primary" title="Modificar">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="panel-footer mt-auto d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
            <p class="m-0">
                Mostrando vehículos del <span th:text="${paginaActual * tamanioPagina + 1}"></span>
                al <span th:text="${(paginaActual + 1) * tamanioPagina > totalItems ? totalItems : (paginaActual + 1) * tamanioPagina}"></span>
                de un total de <span th:text="${totalItems}"></span>
            </p>
            <nav aria-label="Page navigation" th:if="${totalPages > 1}">
                <ul class="pagination m-0">
                    <li class="page-item" th:classappend="${paginaActual == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/vehiculo/listado(page=${paginaActual - 1}, buscar=${busqueda}, disponible=${disponible}, estado=${estadoSeleccionado}, origen=${origenSeleccionado}, propietario=${propietarioSeleccionado}, tipoVehiculo=${tipoVehiculoSeleccionado})}">Anterior</a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${paginaActual == i ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/vehiculo/listado(page=${i}, buscar=${busqueda}, disponible=${disponible}, estado=${estadoSeleccionado}, origen=${origenSeleccionado}, propietario=${propietarioSeleccionado}, tipoVehiculo=${tipoVehiculoSeleccionado})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual + 1 == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/vehiculo/listado(page=${paginaActual + 1}, buscar=${busqueda}, disponible=${disponible}, estado=${estadoSeleccionado}, origen=${origenSeleccionado}, propietario=${propietarioSeleccionado}, tipoVehiculo=${tipoVehiculoSeleccionado})}">Siguiente</a>
                    </li>
                </ul>
            </nav>
            <button class="btn btn-primary-custom btn-report">
                <i class="fa-solid fa-print"></i>
                Imprimir reporte
            </button>
        </div>
    </section>
    <script class="extra-script" src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script class="extra-script" th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            const exito = /*[[${exito}]]*/ null;

            if (exito) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Éxito!',
                    text: exito,
                    confirmButtonColor: '#004b81'
                });
            }
        });
        /*]]>*/
    </script>
</body>
</html>
