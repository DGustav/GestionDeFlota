<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Gestión de Siniestros',
        currentPage='siniestros',
        searchPlaceholder='Buscar siniestro...',
        topbar_action=~{:: .topbar-btn},
        content=~{:: .content-section},
        extra_css=~{},
        extra_scripts=~{:: script.extra-script},
        searchAction='/siniestro/listado'
      )}">
<head>
</head>
<body>

    <a th:href="@{/siniestro/crear}" class="btn btn-primary-custom me-2 text-decoration-none topbar-btn">
        <i class="fa-solid fa-plus"></i>
        <span>Nuevo <span class="d-none d-sm-inline">siniestro</span></span>
    </a>

    <section class="panel mt-4 content-section">
        <!-- Filtros -->
        <div class="filters-bar">
            <form th:action="@{/siniestro/listado}" method="GET">
                <!-- Mantener el parámetro de búsqueda si existe -->
                <input type="hidden" name="buscar" th:value="${busqueda}">
                
                <div class="row g-3">
                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="filter-group">
                            <label>Fecha Particular</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-calendar"></i>
                                <input type="date" name="fecha" class="form-control-custom" th:value="${fecha}">
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="filter-group">
                            <label>Fecha Desde</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-calendar-day"></i>
                                <input type="date" name="fechaDesde" class="form-control-custom" th:value="${fechaDesde}">
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="filter-group">
                            <label>Fecha Hasta</label>
                            <div class="filter-input-group">
                                <i class="fa-solid fa-calendar-check"></i>
                                <input type="date" name="fechaHasta" class="form-control-custom" th:value="${fechaHasta}">
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="filter-group h-100 d-flex flex-column justify-content-end">
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-auto">
                                    <i class="fa-solid fa-filter"></i>
                                    Filtrar
                                </button>
                                <a th:href="@{/siniestro/listado(buscar=${busqueda})}" class="btn btn-secondary w-100 py-2 mt-auto" style="background-color: #6c757d; color: white; border: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-decoration: none;">
                                    <i class="fa-solid fa-eraser me-2"></i>
                                    Limpiar
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="fleet-table table align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Vehículo</th>
                    <th>Conductor</th>
                    <th class="d-none d-md-table-cell">Descripción</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="siniestro : ${siniestros}">
                    <td th:text="'#' + ${siniestro.id}">#1</td>
                    <td th:text="${#temporals.format(siniestro.fechaSiniestro, 'dd/MM/yyyy HH:mm')}">15/03/2026 14:30</td>
                    <td>
                        <div class="desc-title" th:text="${siniestro.contexto.vehiculo.modelo.nombreCompletoModelo}">Ford Mustang 2025</div>
                        <small class="text-muted" th:text="${siniestro.contexto.vehiculo.patente}">AB 123 CD</small>
                    </td>
                    <td th:text="${siniestro.contexto.conductor.nomApe}">Gustavo Porcel</td>
                    <td class="d-none d-md-table-cell text-truncate" style="max-width: 200px;" th:text="${siniestro.descripcion}">Choque leve en estacionamiento</td>
                    <td class="text-center">
                        <a th:href="@{/siniestro/detalle/{id}(id=${siniestro.id})}" class="text-info me-2" title="Ver detalle">
                            <i class="fa-solid fa-eye"></i>
                        </a>
                        <a th:href="@{/siniestro/modificar/{id}(id=${siniestro.id})}" class="text-primary" title="Modificar">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="panel-footer mt-auto d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
            <p class="m-0">
                Mostrando siniestros del <span th:text="${paginaActual * tamanioPagina + 1}"></span>
                al <span th:text="${(paginaActual + 1) * tamanioPagina > totalItems ? totalItems : (paginaActual + 1) * tamanioPagina}"></span>
                de un total de <span th:text="${totalItems}"></span>
            </p>
            <nav aria-label="Page navigation" th:if="${totalPages > 1}">
                <ul class="pagination m-0"
                    th:with="maxPaginas=5,
                 mitad=${maxPaginas / 2},
                 inicio=${paginaActual - mitad < 0 ? 0 : (paginaActual + mitad >= totalPages ? totalPages - maxPaginas : paginaActual - mitad)},
                 final=${paginaActual + mitad >= totalPages ? totalPages - 1 : (paginaActual - mitad < 0 ? (maxPaginas > totalPages ? totalPages - 1 : maxPaginas - 1) : paginaActual + mitad)},
                 inicioReal=${inicio < 0 ? 0 : inicio}">

                    <li class="page-item" th:classappend="${paginaActual == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/siniestro/listado(page=0, buscar=${busqueda}, fecha=${fecha}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta})}" title="Primera página">
                            <i class="fa-solid fa-angles-left"></i>
                        </a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/siniestro/listado(page=${paginaActual - 1}, buscar=${busqueda}, fecha=${fecha}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta})}">Anterior</a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(inicioReal, final)}"
                        th:classappend="${paginaActual == i ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/siniestro/listado(page=${i}, buscar=${busqueda}, fecha=${fecha}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual + 1 == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/siniestro/listado(page=${paginaActual + 1}, buscar=${busqueda}, fecha=${fecha}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta})}">Siguiente</a>
                    </li>

                    <li class="page-item" th:classappend="${paginaActual + 1 == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/siniestro/listado(page=${totalPages - 1}, buscar=${busqueda}, fecha=${fecha}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta})}" title="Última página">
                            <i class="fa-solid fa-angles-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
            <button class="btn btn-primary-custom btn-report">
                <i class="fa-solid fa-print"></i>
                Exportar
            </button>
        </div>
    </section>

    <script class="extra-script" src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script class="extra-script" th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            const exito = /*[[${exito}]]*/ null;
            if (exito) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Éxito!',
                    text: exito,
                    confirmButtonColor: '#004b81'
                });
            }
        });
        /*]]>*/
    </script>
</body>
</html>
