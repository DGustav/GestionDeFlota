<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modificar Vehículo - Gestión de Flota</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
    >
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/modificarVehiculo.css}" />
</head>
<body>
<div class="app container-fluid p-0">
    <!-- Navbar para móviles -->
    <nav class="navbar navbar-expand-lg d-lg-none mobile-navbar">
        <div class="container-fluid">
            <div class="brand-mobile">
                <div class="brand-icon">
                    <i class="fa-solid fa-b"></i>
                </div>
                <span class="brand-text">BIOSIDUS</span>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fa-solid fa-bars text-white"></i>
            </button>
        </div>
    </nav>

    <div class="row g-0 flex-nowrap">
        <!-- Sidebar -->
        <aside class="sidebar col-auto collapse d-lg-flex flex-column" id="sidebarMenu">
            <div class="brand d-none d-lg-flex">
                <div class="brand-icon">
                    <img th:src="@{/images/logo.png}" alt="Logo BIOSIDUS" style="width: 55px; height: auto;">
                </div>
            </div>

            <nav class="menu">
                <a th:href="@{/}" class="menu-item">
                    <i class="fa-solid fa-table-cells-large"></i>
                    <span>Métricas generales</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-car-side"></i>
                    <span>Asignaciones</span>
                </a>

                <a th:href="@{/listadoVehiculos}" class="menu-item active">
                    <i class="fa-solid fa-bus"></i>
                    <span>Vehículos</span>
                </a>

                <a th:href="@{/listadoConductores}" class="menu-item">
                    <i class="fa-solid fa-id-badge"></i>
                    <span>Conductores</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>Services</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Siniestros</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-folder"></i>
                    <span>Documentos</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-bell"></i>
                    <span>Parámetros de Alertas</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content col ps-md-2 pt-2">
            <header class="topbar">
                <div class="topbar-actions d-flex align-items-center justify-content-end w-100">
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-danger-custom d-none d-sm-flex">Cerrar Sesión</button>
                        <span class="user-label d-none d-md-flex">Gustavo Porcel</span>
                        <div class="avatar">BI</div>
                    </div>
                </div>
            </header>

            <div class="mt-4">
                <form action="#" method="POST">
                    <section class="panel">
                        <h2 class="panel-title">
                            <i class="fa-solid fa-car-side"></i>
                            Modificar Vehículo
                        </h2>
                        <div class="row">
                            <!-- Datos del Vehículo -->
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Patente</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-id-card"></i>
                                        <input type="text" class="form-control-custom" placeholder="ABC-123" value="ABC-123" required />
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Modelo</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-car"></i>
                                        <input type="text" class="form-control-custom form-multi-select" list="modelosList" placeholder="Seleccione o ingrese un modelo" value="Toyota Corolla (2022)" required>
                                        <datalist id="modelosList">
                                            <option value="Toyota Corolla (2022)">
                                            <option value="Ford Ranger (2023)">
                                        </datalist>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Kilometraje Actual</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-gauge-high"></i>
                                        <input type="number" class="form-control-custom" placeholder="0" value="15000" required />
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Fecha de Adquisición</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-calendar-days"></i>
                                        <input type="date" class="form-control-custom" value="2022-01-15" required />
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Último Service</label>
                                    <div class="input-container">
                                        <i class="fa-solid fa-wrench"></i>
                                        <input type="date" class="form-control-custom" value="2024-01-10" />
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 d-flex align-items-center">
                                <div class="form-check form-switch ms-2">
                                    <input class="form-check-input" type="checkbox" role="switch" id="disponible" checked>
                                    <label class="form-check-label fw-bold" for="disponible">DISPONIBLE</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions mt-4">
                            <a th:href="@{/listadoVehiculos}" class="btn btn-secondary-custom">
                                <i class="fa-solid fa-xmark"></i>
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary-custom">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Actualizar Vehículo
                            </button>
                        </div>
                    </section>
                </form>
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
