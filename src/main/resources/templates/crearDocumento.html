<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
        title='Crear Documento - Gestión de Flota',
        currentPage='documentos',
        searchPlaceholder=null,
        topbar_action=~{},
        content=~{:: .content-section},
        extra_css=~{:: link.extra-css},
        extra_scripts=~{:: script.extra-scripts}
      )}">
<head>
    <link class="extra-css" rel="stylesheet" th:href="@{/css/crearVehiculo.css}" />
</head>
<body>

    <section class="panel mt-4 content-section">

        <form th:action="@{/documento/guardar}" th:object="${documento}" method="POST" enctype="multipart/form-data">
            <div th:if="${#fields.hasAnyErrors() || (error != null)}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <div th:each="err : ${#fields.allErrors()}" th:text="${err} + '.'"></div>
                <div th:if="${error != null}" th:text="${error}"></div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <section class="panel">
                <h2 class="panel-title">
                    <i class="fa-solid fa-file-invoice"></i>
                    Crear Nuevo Documento
                </h2>
                <div class="row">
                    <!-- Tipo Documento -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Tipo de Documento</label>
                            <div class="input-container">
                                <i class="fa-solid fa-tag"></i>
                                <select th:field="*{tipoDocumento}" class="form-control-custom" id="tipoDocumento" required>
                                    <option value="" disabled selected>Seleccione un tipo</option>
                                    <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Fecha Vencimiento -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Fecha de Vencimiento</label>
                            <div class="input-container">
                                <i class="fa-solid fa-calendar-xmark"></i>
                                <input type="date" th:field="*{fechaVencimiento}" class="form-control-custom" required />
                            </div>
                        </div>
                    </div>

                    <!-- Vehículo -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Vehículo</label>
                            <div class="input-container">
                                <i class="fa-solid fa-car"></i>
                                <input type="text" th:field="*{nombreVehiculo}" class="form-control-custom form-multi-select" list="vehiculosList" id="vehiculoNombre" placeholder="Seleccione un vehículo">
                                <input type="hidden" th:field="*{vehiculoId}" id="vehiculoId">
                                <datalist id="vehiculosList">
                                    <option th:each="v : ${vehiculos}" th:data-id="${v.id}" th:value="${v.patente + ' - ' + v.modelo.nombreCompletoModelo}"></option>
                                </datalist>
                            </div>
                        </div>
                    </div>

                    <!-- Conductor -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Conductor</label>
                            <div class="input-container">
                                <i class="fa-solid fa-user-tie"></i>
                                <input type="text" th:field="*{nombreConductor}" class="form-control-custom form-multi-select" list="conductoresList" id="conductorNombre" placeholder="Seleccione un conductor">
                                <input type="hidden" th:field="*{conductorId}" id="conductorId">
                                <datalist id="conductoresList">
                                    <option th:each="c : ${conductores}" th:data-id="${c.id}" th:value="${c.nomApe}"></option>
                                </datalist>
                            </div>
                        </div>
                    </div>

                    <!-- Estado -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Estado del Documento</label>
                            <div class="input-container">
                                <i class="fa-solid fa-circle-check"></i>
                                <select th:field="*{estadoDocumento}" class="form-control-custom" required>
                                    <option th:each="est : ${estados}" th:value="${est}" th:text="${est}"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Archivo -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Archivo del Documento</label>
                            <div class="input-container">
                                <i class="fa-solid fa-file-arrow-up"></i>
                                <input type="file" th:field="*{archivo}" class="form-control-custom" required />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-actions mt-4">
                    <a th:href="@{/documento/listado}" class="btn btn-secondary-custom text-decoration-none">
                        <i class="fa-solid fa-xmark"></i>
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Guardar Documento
                    </button>
                </div>
            </section>
        </form>
    </section>

    <script class="extra-scripts" th:inline="javascript">
        const vehiculoNombreInput = document.getElementById('vehiculoNombre');
        const vehiculoIdInput = document.getElementById('vehiculoId');
        const vehiculosList = document.getElementById('vehiculosList');

        const conductorNombreInput = document.getElementById('conductorNombre');
        const conductorIdInput = document.getElementById('conductorId');
        const conductoresList = document.getElementById('conductoresList');
        const tipoDocumentoSelect = document.getElementById('tipoDocumento');

        function actualizarHabilitacion() {
            const tipo = tipoDocumentoSelect.value;
            if (tipo === 'REGISTRO') {
                // Solo habilitar conductor
                vehiculoNombreInput.disabled = true;
                vehiculoNombreInput.value = "";
                vehiculoIdInput.value = "";
                
                conductorNombreInput.disabled = false;
            } else {
                // Solo habilitar vehículo (para otros tipos: VTV, CEDULAS, RTO)
                conductorNombreInput.disabled = true;
                conductorNombreInput.value = "";
                conductorIdInput.value = "";
                
                vehiculoNombreInput.disabled = false;
            }
        }

        tipoDocumentoSelect.addEventListener('change', actualizarHabilitacion);

        vehiculoNombreInput.addEventListener('input', function(e) {
            const val = e.target.value;
            const options = vehiculosList.options;
            vehiculoIdInput.value = ""; 
            
            for (let i = 0; i < options.length; i++) {
                if (options[i].value === val) {
                    vehiculoIdInput.value = options[i].getAttribute('data-id');
                    // Si selecciona vehiculo, limpia conductor (doble check)
                    conductorNombreInput.value = "";
                    conductorIdInput.value = "";
                    break;
                }
            }
        });

        conductorNombreInput.addEventListener('input', function(e) {
            const val = e.target.value;
            const options = conductoresList.options;
            conductorIdInput.value = ""; 
            
            for (let i = 0; i < options.length; i++) {
                if (options[i].value === val) {
                    conductorIdInput.value = options[i].getAttribute('data-id');
                    // Si selecciona conductor, limpia vehiculo (doble check)
                    vehiculoNombreInput.value = "";
                    vehiculoIdInput.value = "";
                    break;
                }
            }
        });

        // Validación adicional antes de enviar
        document.querySelector('form').addEventListener('submit', function(e) {
            const tipo = tipoDocumentoSelect.value;
            if (tipo === 'REGISTRO') {
                if (!conductorIdInput.value) {
                    e.preventDefault();
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Para el tipo REGISTRO debe seleccionar un conductor',
                        confirmButtonColor: '#004b81'
                    });
                    return;
                }
            } else if (tipo) {
                if (!vehiculoIdInput.value) {
                    e.preventDefault();
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Para este tipo de documento debe seleccionar un vehículo',
                        confirmButtonColor: '#004b81'
                    });
                    return;
                }
            } else {
                if (!vehiculoIdInput.value && !conductorIdInput.value) {
                    e.preventDefault();
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Debe seleccionar un tipo de documento y su correspondiente vehículo o conductor',
                        confirmButtonColor: '#004b81'
                    });
                }
            }
        });

        window.addEventListener('load', function() {
            actualizarHabilitacion();
            if (vehiculoIdInput.value) {
                const options = vehiculosList.options;
                for (let i = 0; i < options.length; i++) {
                    if (options[i].getAttribute('data-id') === vehiculoIdInput.value) {
                        vehiculoNombreInput.value = options[i].value;
                        break;
                    }
                }
            }
            if (conductorIdInput.value) {
                const options = conductoresList.options;
                for (let i = 0; i < options.length; i++) {
                    if (options[i].getAttribute('data-id') === conductorIdInput.value) {
                        conductorNombreInput.value = options[i].value;
                        break;
                    }
                }
            }
        });

        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            var exito = /*[[${exito}]]*/ null;
            var error = /*[[${error}]]*/ null;

            if (exito) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Éxito!',
                    text: exito,
                    confirmButtonColor: '#004b81'
                });
            }

            if (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error,
                    confirmButtonColor: '#004b81'
                });
            }
        });
        /*]]>*/
    </script>
</body>
</html>
