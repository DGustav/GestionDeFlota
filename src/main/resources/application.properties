spring.datasource.url=jdbc:mysql://localhost:3306/gestiondeflota
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ruta de archivos subidos
spring.servlet.multipart.location=C:/archivosGestionDeFlota

# Tamaño máximo permitido para un solo archivo (ejemplo: 10MB)
spring.servlet.multipart.max-file-size=10MB

# Tamaño máximo permitido para la solicitud completa (archivo + otros datos del form)
spring.servlet.multipart.max-request-size=10MB
