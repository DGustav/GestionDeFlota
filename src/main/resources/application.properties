spring.datasource.url=jdbc:mysql://localhost:3306/gestiondeflota
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ruta de archivos subidos
spring.servlet.multipart.location=C:/archivosGestionDeFlota

# Tamaño máximo permitido para un solo archivo (ejemplo: 10MB)
spring.servlet.multipart.max-file-size=10MB

# Tamaño máximo permitido para la solicitud completa (archivo + otros datos del form)
spring.servlet.multipart.max-request-size=10MB

# Propieades para el envío de correos
spring.mail.host=192.168.2.21
spring.mail.port=25
spring.mail.username=biosistemas@biosidus.com.ar
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
